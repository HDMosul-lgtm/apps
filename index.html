<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDMosul Store</title>
<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.card{
  width:95%;
  max-width:1400px;
  padding:20px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* اسم المتجر مع العلم */
.logo-container{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:10px;
}
.logo{
  font-size:48px;
  font-weight:900;
  color:#ff4d4d; /* أحمر */
  text-shadow: 0 0 5px #000, 0 0 10px #000, 0 0 15px #000;
  animation:logoGlow 2s ease-in-out infinite alternate;
}
@keyframes logoGlow{
  0%{text-shadow: 0 0 5px #000, 0 0 10px #000, 0 0 15px #000;}
  50%{text-shadow: 0 0 8px #000, 0 0 14px #000, 0 0 20px #000;}
  100%{text-shadow: 0 0 5px #000, 0 0 10px #000, 0 0 15px #000;}
}
.logo img{
  height:50px;
  width:50px;
  border-radius:50%;
  border:2px solid #ff4d4d;
}

/* شعار فرعي */
.sublogo{
  color:#ffc107;
  margin-bottom:15px;
  font-size:20px;
}

/* عداد الوقت */
.maint{
  display:inline-block;
  padding:10px 20px;
  border-radius:12px;
  background:rgba(0,0,0,0.3);
  border:1px solid rgba(255,77,77,0.5);
  font-size:16px;
  margin-bottom:15px;
  box-shadow:0 0 20px rgba(255,77,77,0.5);
}
.count{
  margin-top:5px;
  color:#ff4d4d;
  font-weight:bold;
  font-size:16px;
  text-shadow:1px 1px 5px rgba(0,0,0,0.7);
}

/* Grid responsive */
.download{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  width:100%;
}

/* أزرار التطبيقات موحدة الحجم */
.app-card{
  border-radius:15px;
  padding:20px 10px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  color:#fff;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  text-decoration:none;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:140px;
}
.app-card:hover{
  transform:scale(1.05);
  box-shadow:0 15px 40px rgba(0,0,0,.6);
}

/* ألوان ثابتة لكل زر */
.btn1{background:#25D366;} /* برايم تيفي */
.btn3{background:#6610f2;} /* سينمانا لينباك */
.btn4{background:#ff5722;} /* 1 IRAQ TV */

/* الوصف */
.desc{
  font-size:14px;
  color:#ffc107;
  margin-top:5px;
  line-height:1.2;
}

/* شريط الأذكار */
.footer{
  width:100%;
  overflow:hidden;
  background:rgba(0,0,0,.2);
  margin-top:20px;
}
.marquee{
  display:inline-block;
  white-space:nowrap;
  padding-right:100%;
  animation:move 90s linear infinite; 
  font-size:18px;
  color:#ffc107
}
@keyframes move{
  0%{transform:translateX(0)}
  100%{transform:translateX(100%)}
}

/* Responsive adjustments */
@media screen and (max-width: 600px){
  .app-card{min-height:120px;}
  .logo{font-size:36px;}
  .logo img{height:40px;width:40px;}
}
</style>
</head>
<body>

<div class="card">

  <!-- اسم المتجر مع العلم المبسط بدون صليب -->
  <div class="logo-container">
    <div class="logo">HDMosul Store</div>
    <img src="https://i.ibb.co/W2F0qgX/real-madrid-no-cross.png" alt="Real Madrid Flag">
  </div>

  <div class="sublogo">تجريبي</div>

  <div class="maint">
    ⚠️ الموقع تحت الصيانة
    <div class="count" id="countdown"></div>
  </div>

  <div class="download">
    <a class="app-card btn1" href="#" target="_blank">
      <div>برايم تيفي</div>
      <div class="desc">كود التفعيل: 2026</div>
    </a>
    <a class="app-card btn3" href="#" target="_blank">
      <div>سينمانا لينباك</div>
      <div class="desc">نسخة مخصصة للشاشات وتيفي بوكس سريعة جدا</div>
    </a>
    <a class="app-card btn4" href="#" target="_blank">
      <div>1 IRAQ TV</div>
      <div class="desc">مدعوم بجميع شبكات لمشاهدة مباريات ومسلسلات ونتفلكس | Android_AppsX</div>
    </a>
  </div>
</div>

<div class="footer">
  <div class="marquee">
    الحمد لله | سبحان الله | تنبيه: تطبيقات مجانية | اذا احتاجت شي راسلني واتساب: 07766780579
  </div>
</div>

<script>
// الساعة والتاريخ الحية بتوقيت نينوى
function updateClock(){
  let now = new Date();
  let utc = now.getTime() + (now.getTimezoneOffset() * 60000);
  let iraqTime = new Date(utc + (3*60*60*1000));

  const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const dayName = days[iraqTime.getDay()];
  const date = iraqTime.getDate().toString().padStart(2,'0');
  const month = (iraqTime.getMonth()+1).toString().padStart(2,'0');
  const year = iraqTime.getFullYear();

  const hours = iraqTime.getHours().toString().padStart(2,'0');
  const minutes = iraqTime.getMinutes().toString().padStart(2,'0');
  const seconds = iraqTime.getSeconds().toString().padStart(2,'0');

  document.getElementById("countdown").innerHTML = `${dayName} ${date}/${month}/${year} - ${hours}:${minutes}:${seconds}`;
}
setInterval(updateClock,1000);
</script>

</body>
</html>
