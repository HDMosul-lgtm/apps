<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDMosul Store</title>
<style>
/* ======== إعدادات عامة ======== */
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  padding-bottom:20px;
}

/* ======== اسم المتجر 3D متحرك ======== */
@keyframes logoGradient{
  0%{color:#0dcaf0;}
  25%{color:#6610f2;}
  50%{color:#ffc107;}
  75%{color:#ff5722;}
  100%{color:#0dcaf0;}
}
.logo{
  font-size:6vw;
  font-weight:900;
  margin:4vh 0 2vh;
  animation:logoGradient 3s linear infinite;
  text-shadow:2px 2px 4px #000,0 0 10px #0dcaf0,0 0 20px #6610f2;
}
.sublogo{
  color:#ffc107;
  margin-bottom:3vh;
  font-size:4vw;
}

/* ======== عداد الصيانة ======== */
.maint{
  padding:3vh 2vw;
  border-radius:15px;
  background:rgba(255,193,7,.1);
  border:1px solid rgba(255,193,7,.4);
  font-size:4vw;
  margin-bottom:3vh;
  text-align:center;
}
.count{
  color:#ffc107;
  font-weight:bold;
  font-size:5vw;
  margin-top:1vh;
}

/* ======== Grid التطبيقات ======== */
.download{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  width:95%;
  margin-bottom:3vh;
}

/* ======== مربعات التطبيقات ======== */
.app-card{
  border-radius:15px;
  padding:4vh 1vw;
  font-size:4vw;
  font-weight:bold;
  text-align:center;
  color:#fff;
  cursor:pointer;
  transition:0.3s;
  box-shadow:0 8px 20px rgba(0,0,0,.4);
  text-decoration:none;
}
.app-card:hover{
  transform:scale(1.05);
  box-shadow:0 12px 35px rgba(0,0,0,.6);
}

/* ======== ألوان الأزرار ======== */
.btn1{background:#25D366}
.btn2{background:#0d6efd}
.btn3{background:#6610f2}
.btn4{background:#ff5722}

/* ======== الوصف تحت كل زر ======== */
.desc{
  font-size:3vw;
  color:#ffc107;
  margin-top:8px;
  line-height:1.3;
  min-height:auto;
}

/* ======== شريط الأذكار ======== */
.footer{
  width:100%;
  overflow:hidden;
  background:rgba(0,0,0,.2);
  margin-top:3vh;
  padding:1vh 0;
}
.marquee{
  display:inline-block;
  white-space:nowrap;
  padding-right:100%;
  animation:move 120s linear infinite;
  font-size:4vw;
}
@keyframes move{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* ======== استجابة للشاشات الصغيرة ======== */
@media screen and (max-width:480px){
  .logo{font-size:8vw;}
  .sublogo{font-size:5vw;}
  .maint{font-size:5vw;padding:3vh 4vw;}
  .count{font-size:6vw;}
  .app-card{font-size:5vw;padding:5vw 2vw;}
  .desc{font-size:4vw;}
  .marquee{font-size:5vw;}
}
</style>
</head>
<body>

<div class="logo">HDMosul Store</div>
<div class="sublogo">متجر التطبيقات التجريبي</div>

<div class="maint">
⚠️ المتجر تحت الصيانة ⚠️
<div class="count">ينتهي بعد 10 أيام</div>
</div>

<div class="download">
<a href="#" class="app-card btn1">
  برايم تيفي
  <div class="desc">أفضل القنوات المشفرة والمباشرة</div>
</a>
<a href="#" class="app-card btn2">
  سينمانا شاشة
  <div class="desc">أحدث الأفلام والعروض</div>
</a>
<a href="#" class="app-card btn3">
  سينمانا لينباك
  <div class="desc">مكتبة ضخمة من المسلسلات</div>
</a>
<a href="#" class="app-card btn4">
  1 IRAQ TV
  <div class="desc">قنوات عراقية حية</div>
</a>
</div>

<div class="footer">
  <div class="marquee">الحمدلله سبحان الله - وصل على النبي - استمتع بتطبيقات HDMosul</div>
</div>

</body>
</html>
