<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDMosul Store</title>
<style>
:root {
  --bg-light: #f5f5f5;
  --bg-dark: linear-gradient(135deg,#0f172a,#1e293b);
  --text-light: #111;
  --text-dark: #fff;
  --btn1-light: #4CAF50;
  --btn3-light: #3F51B5;
  --btn4-light: #FF9800;
  --btn1-dark: #25D366;
  --btn3-dark: #6610f2;
  --btn4-dark: #ff5722;
}

/* الوضع الافتراضي داكن */
body{
  margin:0;
  font-family:sans-serif;
  background: var(--bg-dark);
  color: var(--text-dark);
  display:flex;
  flex-direction:column;
  align-items:center;
  transition: all 0.5s ease;
}

.card{
  width:95%;
  max-width:1400px;
  padding:20px;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  transition: all 0.5s ease;
}

/* اسم المتجر مع رمز ريال مدريد */
.logo-container{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:10px;
}
.logo{
  font-size:48px;
  font-weight:900;
  color:#ff4d4d; 
  text-shadow: 0 0 5px #000, 0 0 10px #000, 0 0 15px #000;
  animation:logoGlow 2s ease-in-out infinite alternate;
  transition: all 0.5s ease;
}
@keyframes logoGlow{
  0%{text-shadow: 0 0 5px #000, 0 0 10px #000, 0 0 15px #000;}
  50%{text-shadow: 0 0 8px #000, 0 0 14px #000, 0 0 20px #000;}
  100%{text-shadow: 0 0 5px #000, 0 0 10px #000, 0 0 15px #000;}
}

/* رمز ريال مدريد صغير بجانب الاسم */
.logo .realmadrid{
  font-size:24px;
  color:#fff;
  text-shadow: 0 0 2px #000;
}

/* شعار فرعي */
.sublogo{
  color:#ffc107;
  margin-bottom:15px;
  font-size:20px;
  transition: all 0.5s ease;
}

/* عداد الوقت */
.maint{
  display:inline-block;
  padding:10px 20px;
  border-radius:12px;
  background:rgba(0,0,0,0.3);
  border:1px solid rgba(255,77,77,0.5);
  font-size:16px;
  margin-bottom:15px;
  box-shadow:0 0 20px rgba(255,77,77,0.5);
  transition: all 0.5s ease;
}
.count{
  margin-top:5px;
  color:#ff4d4d;
  font-weight:bold;
  font-size:16px;
  text-shadow:1px 1px 5px rgba(0,0,0,0.7);
}

/* Grid responsive */
.download{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  width:100%;
  transition: all 0.5s ease;
}

/* أزرار التطبيقات */
.app-card{
  border-radius:15px;
  padding:20px 10px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
  color:#fff;
  cursor:pointer;
  transition: all 0.5s ease;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
  text-decoration:none;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:140px;
}
.app-card:hover{
  transform:scale(1.05);
  box-shadow:0 12px 30px rgba(0,0,0,.5);
}

/* ألوان مناسبة لكل وضع */
.btn1{background:#25D366;} 
.btn3{background:#6610f2;}
.btn4{background:#ff5722;}

/* الوصف */
.desc{
  font-size:14px;
  color:#fff;
  margin-top:5px;
  line-height:1.2;
  transition: all 0.5s ease;
}

/* شريط الأذكار */
.footer{
  width:100%;
  overflow:hidden;
  background:rgba(0,0,0,.2);
  margin-top:20px;
  transition: all 0.5s ease;
}
.marquee{
  display:inline-block;
  white-space:nowrap;
  padding-right:100%;
  animation:move 90s linear infinite; 
  font-size:18px;
  color:#ffc107;
  transition: all 0.5s ease;
}
@keyframes move{
  0%{transform:translateX(0)}
  100%{transform:translateX(100%)}
}

/* زر تغيير الوضع */
.mode-btn{
  position:fixed;
  top:10px;
  left:10px;
  padding:8px 12px;
  background:#ff4d4d;
  color:#fff;
  border:none;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
  z-index:1000;
  transition: all 0.5s ease;
}

/* الوضع النهاري */
body.light{
  background: var(--bg-light);
  color: var(--text-light);
}
body.light .maint{
  background: rgba(0,0,0,0.05);
  border:1px solid rgba(0,0,0,0.2);
  box-shadow:0 0 20px rgba(0,0,0,0.1);
}
body.light .app-card.btn1{background: var(--btn1-light);}
body.light .app-card.btn3{background: var(--btn3-light);}
body.light .app-card.btn4{background: var(--btn4-light);}
body.light .desc{color:#111;}
body.light .footer{background: rgba(0,0,0,0.05);}
</style>
</head>
<body>

<button class="mode-btn" onclick="toggleMode()">تغيير الوضع</button>

<div class="card">

  <!-- اسم المتجر مع رمز ريال مدريد -->
  <div class="logo-container">
    <div class="logo">HDMosul Store <span class="realmadrid">⚽</span></div>
  </div>

  <div class="sublogo">تجريبي</div>

  <div class="maint">
    ⚠️ الموقع تحت الصيانة
    <div class="count" id="countdown"></div>
  </div>

  <div class="download">
    <a class="app-card btn1" href="#" target="_blank">
      <div>برايم تيفي</div>
      <div class="desc">كود التفعيل: 2026</div>
    </a>
    <a class="app-card btn3" href="#" target="_blank">
      <div>سينمانا لينباك</div>
      <div class="desc">نسخة مخصصة للشاشات وتيفي بوكس سريعة جدا</div>
    </a>
    <a class="app-card btn4" href="#" target="_blank">
      <div>1 IRAQ TV</div>
      <div class="desc">مدعوم بجميع شبكات لمشاهدة مباريات ومسلسلات ونتفلكس | Android_AppsX</div>
    </a>
  </div>
</div>

<div class="footer">
  <div class="marquee">
    الحمد لله | سبحان الله | تنبيه: تطبيقات مجانية | اذا احتاجت شي راسلني واتساب: 07766780579
  </div>
</div>

<script>
// الساعة والتاريخ الحية بتوقيت نينوى
function updateClock(){
  let now = new Date();
  let utc = now.getTime() + (now.getTimezoneOffset() * 60000);
  let iraqTime = new Date(utc + (3*60*60*1000));

  const days = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  const dayName = days[iraqTime.getDay()];
  const date = iraqTime.getDate().toString().padStart(2,'0');
  const month = (iraqTime.getMonth()+1).toString().padStart(2,'0');
  const year = iraqTime.getFullYear();

  const hours = iraqTime.getHours().toString().padStart(2,'0');
  const minutes = iraqTime.getMinutes().toString().padStart(2,'0');
  const seconds = iraqTime.getSeconds().toString().padStart(2,'0');

  document.getElementById("countdown").innerHTML = `${dayName} ${date}/${month}/${year} - ${hours}:${minutes}:${seconds}`;
}
setInterval(updateClock,1000);

// تبديل الوضع
function toggleMode(){
  document.body.classList.toggle('light');
}
</script>

</body>
</html>
