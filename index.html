<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDMosul Store</title>
<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#fff;
}
.card{
  width:95%;
  max-width:450px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(15px);
  padding:25px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.logo{
  font-size:32px;
  font-weight:900;
  background:linear-gradient(90deg,#0d6efd,#6610f2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}
.dua{
  color:#ccc;
  font-size:14px;
  margin-bottom:20px;
  text-align:center;
}
.apps{
  text-align:right;
  margin-bottom:20px;
}
.app-item{
  background:rgba(37,211,102,.1);
  border:1px solid rgba(37,211,102,.3);
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}
.app-item a{
  display:block;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  background:#25D366;
  padding:10px;
  border-radius:8px;
}
.maint{
  margin-top:10px;
  padding:20px;
  border-radius:12px;
  background:rgba(255,193,7,.1);
  border:1px solid rgba(255,193,7,.4);
}
.count{
  margin-top:10px;
  font-size:18px;
  color:#ffc107;
  font-weight:bold;
}
.footer{
  margin-top:20px;
  font-size:12px;
  color:#aaa;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">HDMosul Store</div>
  <div class="dua">لا تنسونا من صالح دعائكم 🤍</div>

  <div class="apps" id="appsContainer">
    <!-- التطبيقات سيتم إضافتها ديناميكيًا -->
  </div>

  <div class="maint">
    <div style="font-size:35px">⚠️</div>
    <div>الموقع تحت الصيانة</div>
    <div class="count" id="c"></div>
  </div>

  <div class="footer">نعود قريباً ❤️</div>
</div>

<script>
// مصفوفة التطبيقات: ضع هنا اسم التطبيق ورابطه
const apps = [
  {name: "تطبيق شاشات", link: "https://example.com/app1"},
  {name: "تطبيق تيفي بوكس", link: "https://example.com/app2"},
  {name: "تطبيق جديد", link: "https://example.com/app3"}
];

// إنشاء التطبيقات تلقائيًا
const container = document.getElementById("appsContainer");
apps.forEach(app => {
  const div = document.createElement("div");
  div.className = "app-item";
  div.innerHTML = `<div>${app.name}</div><a href="${app.link}" target="_blank">تحميل التطبيق</a>`;
  container.appendChild(div);
});

// العداد التنازلي للصيانة
let e=new Date(); e.setDate(e.getDate()+10); // 10 أيام
function u(){
  let n=new Date(), d=e-n;
  if(d<=0) return c.innerHTML="انتهى 🚀";
  let D=Math.floor(d/864e5),
      H=Math.floor(d/36e5)%24,
      M=Math.floor(d/6e4)%60,
      S=Math.floor(d/1e3)%60;
  c.innerHTML=D+" يوم : "+H+" ساعة : "+M+" دقيقة : "+S+" ثانية";
}
setInterval(u,1000); u();
</script>

</body>
</html>
