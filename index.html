<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDMosul Store</title>
<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#fff;
  flex-direction:column;
}
.card{
  width:600px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(15px);
  padding:40px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  margin-bottom:20px;
}
.logo{
  font-size:48px;
  font-weight:900;
  background:linear-gradient(90deg,#0d6efd,#6610f2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.sublogo{
  font-size:20px;
  color:#ffc107;
  margin-bottom:25px;
}
.maint{
  padding:25px;
  border-radius:20px;
  background:rgba(255,193,7,.1);
  border:1px solid rgba(255,193,7,.4);
  font-size:26px;
  margin-bottom:15px;
}
.count{
  margin-top:10px;
  font-size:28px;
  color:#ffc107;
  font-weight:bold;
}

/* الأزرار */
.download a{
  display:block;
  margin:12px auto;
  padding:16px;
  font-size:22px;
  font-weight:bold;
  color:#fff;
  border-radius:14px;
  text-decoration:none;
  width:80%;
}

/* ألوان */
.btn1{background:linear-gradient(45deg,#25D366,#1ebe57);}
.btn2{background:linear-gradient(45deg,#0d6efd,#0b5ed7);}
.btn3{background:linear-gradient(45deg,#6610f2,#520dc2);}

.activation,.note,.desc{
  margin-top:6px;
  font-size:16px;
}
.note{color:#ffc107;}
.desc{color:#ccc;}

.footer{
  width:100%;
  overflow:hidden;
  background:rgba(0,0,0,.2);
}
.marquee{
  display:inline-block;
  padding-left:100%;
  animation: move 30s linear infinite;
  font-size:24px;
  color:#ffc107;
}
@keyframes move{
  100%{transform:translateX(-100%);}
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">HDMosul Store</div>
  <div class="sublogo">متجر تجريبي - كود التفعيل: 2026</div>

  <div class="maint">
    ⚠️ الموقع تحت الصيانة
    <div class="count" id="countdown"></div>
  </div>

  <div class="download">
    
    <a class="btn1" href="https://www.mediafire.com/file/wi2ngm2mohy0ust/PrimeTV+v1.6.0.apk/file" target="_blank">
      تحميل برايم تيفي
    </a>
    <div class="activation">كود التفعيل: 2026</div>

    <a class="btn2" href="https://www.mediafire.com/file/f5bayroe9arsszp/%D8%B3%D9%8A%D9%86%D9%85%D8%A7%D9%86%D8%A7+TV.apk/file" target="_blank">
      تحميل سينمانا شاشة
    </a>
    <div class="note">يعمل على: ايرثلنك + كيبل ضوئي</div>

    <a class="btn3" href="https://mega.nz/file/RMsH3AYZ#P7JESgsIhKIkz_gN6_ghpKMOizb54mkBocz-Yktb6cA" target="_blank">
      تحميل سينمانا لينباك
    </a>
    <div class="desc">النسخة المخصصة للشاشات وأجهزة تيفي بوكس سريعة جدا</div>

  </div>
</div>

<div class="footer">
  <div class="marquee">الحمد لله | سبحان الله | الحمد لله | سبحان الله</div>
</div>

<script>
// عد تنازلي 10 أيام
let endDate = new Date();
endDate.setDate(endDate.getDate() + 10);

function updateCountdown(){
  let now = new Date().getTime();
  let distance = endDate - now;

  let days = Math.floor(distance / (1000*60*60*24));
  let hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
  let minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
  let seconds = Math.floor((distance % (1000*60)) / 1000);

  document.getElementById("countdown").innerHTML =
    days + " يوم : " + hours + " ساعة : " + minutes + " دقيقة : " + seconds + " ثانية";

  if(distance < 0){
    document.getElementById("countdown").innerHTML = "تم انتهاء الصيانة";
  }
}

setInterval(updateCountdown,1000);
</script>

</body>
</html>
