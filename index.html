<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDMosul Store</title>
<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#fff;
}
.card{
  width:600px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(15px);
  padding:40px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.logo{
  font-size:48px;
  font-weight:900;
  background:linear-gradient(90deg,#0d6efd,#6610f2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:30px;
}
.maint{
  padding:30px;
  border-radius:20px;
  background:rgba(255,193,7,.1);
  border:1px solid rgba(255,193,7,.4);
  font-size:28px;
}
.count{
  margin-top:15px;
  font-size:36px;
  color:#ffc107;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">HDMosul Store</div>

  <div class="maint">
    ⚠️ الموقع تحت الصيانة
    <div class="count" id="c"></div>
  </div>
</div>

<script>
// عداد الوقت (ساعات/دقائق/ثواني)
let e=new Date(); 
e.setHours(e.getHours()+10); // 10 ساعات
function u(){
  let n=new Date(), d=e-n;
  if(d<=0) return c.innerHTML="انتهى 🚀";
  let H=Math.floor(d/36e5),
      M=Math.floor(d/6e4)%60,
      S=Math.floor(d/1e3)%60;
  c.innerHTML=H+" ساعة : "+M+" دقيقة : "+S+" ثانية";
}
setInterval(u,1000); u();
</script>

</body>
</html>
