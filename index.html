<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMosul Store - RM Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-royal: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --madrid-blue: #003366;
            --deep-black: #050505;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--deep-black);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }

        /* حاوية الشعار المركزية */
        .maintenance-wrapper {
            position: relative;
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* شعار ريال مدريد البرمجي */
        .rm-crest {
            position: relative;
            width: clamp(180px, 40vw, 280px);
            height: clamp(180px, 40vw, 280px);
            margin: 0 auto;
            border-radius: 50%;
            background: var(--gold-royal);
            padding: 8px;
            box-shadow: 0 0 50px rgba(179, 135, 40, 0.3);
            animation: float 4s ease-in-out infinite;
        }

        .inner-circle {
            width: 100%; height: 100%;
            background: #fff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 4px solid var(--madrid-blue);
            display: flex; justify-content: center; align-items: center;
        }

        /* الخط المائل الخاص بالشعار */
        .diagonal-stripe {
            position: absolute;
            width: 150%; height: 40px;
            background: var(--madrid-blue);
            transform: rotate(-45deg);
            z-index: 1;
        }

        /* التاج الملكي */
        .crown {
            position: absolute;
            top: -45px; left: 50%;
            transform: translateX(-50%);
            font-size: clamp(50px, 12vw, 80px);
            z-index: 10;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
        }

        /* الترس المتحرك (أداة الصيانة) */
        .maintenance-gear {
            position: absolute;
            bottom: -10px; right: 10px;
            width: clamp(60px, 15vw, 100px);
            height: clamp(60px, 15vw, 100px);
            background: var(--gold-royal);
            clip-path: polygon(50% 0%, 61% 10%, 75% 10%, 75% 25%, 90% 39%, 90% 50%, 90% 61%, 75% 75%, 75% 90%, 61% 90%, 50% 100%, 39% 90%, 25% 90%, 25% 75%, 10% 61%, 10% 50%, 10% 39%, 25% 25%, 25% 10%, 39% 10%);
            display: flex; justify-content: center; align-items: center;
            animation: rotateGear 6s linear infinite;
            z-index: 20;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .gear-center {
            width: 30%; height: 30%;
            background: var(--deep-black);
            border-radius: 50%;
        }

        /* نصوص توضيحية فخمة */
        .store-name {
            margin-top: 50px;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 900;
            background: var(--gold-royal);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .status-text {
            color: #666;
            font-size: clamp(0.8rem, 2vw, 1rem);
            letter-spacing: 5px;
            margin-top: 10px;
            font-weight: bold;
        }

        /* الأنيميشن */
        @keyframes rotateGear {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* استجابة الشاشات الكبيرة */
        @media (min-width: 1200px) {
            .maintenance-wrapper { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="maintenance-wrapper">
        <div class="crown">👑</div>

        <div class="rm-crest">
            <div class="inner-circle">
                <div class="diagonal-stripe"></div>
                <span style="z-index: 2; font-size: 50px; color: #003366; font-weight: 900; opacity: 0.8;">MCF</span>
            </div>
            
            <div class="maintenance-gear">
                <div class="gear-center"></div>
            </div>
        </div>

        <h1 class="store-name">HDMosul Store</h1>
        <p class="status-text">UNDER MAINTENANCE • 2026</p>
    </div>

</body>
</html>
