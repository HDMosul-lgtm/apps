<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMosul Store - VIP Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-gradient: linear-gradient(145deg, #c5a059 0%, #fff2a1 50%, #ad7a27 100%);
            --deep-dark: #0a0a0a;
            --border-gold: #8a6d3b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            /* خلفية توحي بمعدن مصقول وراقي */
            background-image: 
                radial-gradient(circle at 50% 50%, #151515 0%, #050505 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* اللوحة الرئيسية المذهبة */
        .vip-frame {
            position: relative;
            width: 90%;
            max-width: 650px;
            background: #111111;
            padding: 4px; /* لإنشاء الإطار */
            background-image: var(--gold-gradient);
            border-radius: 5px;
            box-shadow: 0 30px 60px rgba(0,0,0,1), 0 0 20px rgba(173, 122, 39, 0.2);
        }

        .inner-content {
            background: #0f0f0f;
            padding: 50px 30px;
            border-radius: 2px;
            text-align: center;
            position: relative;
            /* لمسة "برش" معدني خفيفة */
            background-image: repeating-linear-gradient(rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 2px);
        }

        /* شعار التاج أو النادي */
        .top-crown {
            width: 70px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px #d4af37);
        }

        .brand-title {
            font-size: 3rem;
            font-weight: 900;
            margin: 0;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .brand-sub {
            font-size: 14px;
            color: var(--border-gold);
            letter-spacing: 10px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 40px;
            display: block;
        }

        /* أيقونة الصيانة الاحترافية */
        .maintenance-gear-box {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }

        .big-gear {
            font-size: 80px;
            color: #d4af37;
            display: inline-block;
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3));
        }

        /* النصوص */
        .status-title {
            font-size: 2rem;
            color: #fff2a1;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .status-desc {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #ccc;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .highlight {
            color: #fff;
            border-bottom: 2px solid #ad7a27;
            padding-bottom: 2px;
        }

        /* البار السفلي الصلب */
        .footer-bar {
            background: linear-gradient(to right, transparent, #ad7a27, transparent);
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #000;
            background-color: #d4af37; /* لون صلب */
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        /* أيقونات صغيرة تدل على العمل */
        .tool-icon {
            font-size: 1.2rem;
        }

        /* لمعان خفيف جداً (ثابت) */
        .inner-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div class="vip-frame">
        <div class="inner-content">
            
            <div style="font-size: 40px; margin-bottom: 10px;">👑</div>
            
            <h1 class="brand-title">HDMosul Store</h1>
            <span class="brand-sub">VIP • EXCLUSIVE</span>

            <div class="maintenance-gear-box">
                <div class="big-gear">⚙️</div>
            </div>

            <div class="status-title">تحديث تقني طارئ 🛠️</div>
            
            <p class="status-desc">
                نعتذر لمشتركينا الكرام، المتجر مغلق مؤقتاً لأعمال <span class="highlight">صيانة وتحسين</span> روابط التطبيقات الجديدة.
                <br><br>
                المتجر سيعود للعمل بالكامل <span class="highlight">خلال ساعات قليلة</span>.
            </p>

            <div class="footer-bar">
                <span class="tool-icon">🔧</span>
                <span>VIP PREMIUM EXCLUSIVE • فريق HDMosul Store</span>
                <span class="tool-icon">🛠️</span>
            </div>

            <p style="font-size: 0.75rem; color: #555; margin-top: 20px; font-weight: bold;">
                6 أبريل 2026 • 12:05 مساءً
            </p>
        </div>
    </div>

</body>
</html>
