<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDMosul Store</title>

<style>
/* نفس تصميمك بدون تغيير */
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

.maintenance-panel {
  margin-top: 20px;
}

#live-clock {
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="maintenance-panel">
  <div>⚠️ الموقع تحت الصيانة</div>
  <div id="live-clock">جاري التحميل...</div>
</div>

<script>
// نخزن مزود الخدمة مرة وحدة فقط
let ispText = "جاري التحميل...";

async function fetchISP(){
  try{
    const res = await fetch('https://ipapi.co/json/');
    const data = await res.json();
    let org = data.org || "غير متوفر";

    const translations = {
      "Asiacell": "آسياسيل",
      "Zain": "زين",
      "Fastlink": "فاستلينك",
      "Korek": "كورك"
    };

    for(let key in translations){
      if(org.includes(key)){
        org = translations[key];
        break;
      }
    }

    ispText = org;

  }catch{
    ispText = "غير متوفر";
  }
}

// تحديث الساعة فقط
function updateClock(){
  let iraq = new Date(new Date().getTime() + (3*60*60*1000 + new Date().getTimezoneOffset()*60000));

  document.getElementById("live-clock").innerHTML =
    iraq.toLocaleTimeString('ar-EG') +
    " | مزود الخدمة: " + ispText;
}

setInterval(updateClock, 1000);
fetchISP();
</script>

</body>
</html>
