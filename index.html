<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMosul Store - صيانة ملكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-bright: #fff2a1;
            --gold-dark: #ad7a27;
            --premium-black: #050505;
            --text-white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--premium-black);
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            /* خلفية بتأثير شبكي تقني */
            background-image: 
                linear-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* الحاوية الرئيسية بتأثير الزجاج */
        .glass-card {
            position: relative;
            width: 90%;
            max-width: 550px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            z-index: 2;
        }

        /* الإطار المتحرك الاحترافي */
        .glass-card::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(90deg, transparent, #d4af37, #fff, #d4af37, transparent);
            background-size: 200% 100%;
            border-radius: 32px;
            z-index: -1;
            animation: moveLight 3s linear infinite;
        }

        @keyframes moveLight {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* شعار المتجر - لمعان عالي */
        .brand-name {
            font-size: 2.8rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to bottom, #fff2a1, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
        }

        .vip-badge {
            color: #d4af37;
            letter-spacing: 6px;
            font-size: 12px;
            margin-bottom: 30px;
            display: block;
            font-weight: 700;
        }

        /* أيقونة الصيانة (ترس متحرك بالـ CSS) */
        .maintenance-icon {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
        }

        .gear {
            width: 80px;
            height: 80px;
            background: #d4af37;
            border-radius: 50%;
            position: relative;
            margin: 10px auto;
            animation: rotateGear 5s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* رسم أسنان الترس */
        .gear::before {
            content: "";
            position: absolute;
            width: 90px; height: 90px;
            border-radius: 10px;
            background: transparent;
            box-shadow: 
                0 0 0 12px #d4af37 inset,
                20px 20px 0 0 #d4af37, -20px -20px 0 0 #d4af37,
                20px -20px 0 0 #d4af37, -20px 20px 0 0 #d4af37; /* أسنان الترس بسيطة بالرسم */
        }
        
        .gear-inner {
            width: 30px; height: 30px;
            background: var(--premium-black);
            border-radius: 50%;
            z-index: 2;
        }

        @keyframes rotateGear {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* النصوص بوضوح عالي */
        .main-msg {
            font-size: 1.6rem;
            color: #fff;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
        }

        .sub-msg {
            font-size: 1.1rem;
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .time-badge {
            display: inline-block;
            background: linear-gradient(45deg, #ad7a27, #5f4111);
            color: #fff;
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px solid #fff2a1;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        .footer-text {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #666;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1 class="brand-name">HDMosul Store</h1>
        <span class="vip-badge">PREMIUM EXCLUSIVE</span>

        <div class="maintenance-icon">
            <div class="gear">
                <div class="gear-inner"></div>
            </div>
        </div>

        <div class="main-msg">تحديث تقني جاري الآن.. 🛠️</div>
        
        <p class="sub-msg">
            نعتذر لمشتركينا الكرام عن التوقف المؤقت. 
            <br>
            نحن نعمل على صيانة وتحسين روابط التطبيقات الجديدة.
        </p>

        <div class="time-badge">يعود المتجر للعمل خلال ساعات قليلة ⏳</div>

        <div class="footer-text">
            © 2026 فريق HDMosul Store • جميع الحقوق محفوظة
        </div>
    </div>

</body>
</html>
