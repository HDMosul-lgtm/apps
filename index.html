<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMosul Store • VIP</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ==================== */
        /*   Madridista Theme   */
        /* ==================== */
        :root {
            --primary-color: #00529f;
            --secondary-color: #febd11;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #0a1a2b;
            --border-color: #febd11;
            --btn-radius: 50px;
            --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        /* الثيمات المختلفة */
        [data-theme="madrid"] {
            --primary-color: #00529f;
            --secondary-color: #febd11;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #0a1a2b;
            --border-color: #febd11;
            --btn-radius: 50px;
            --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        [data-theme="blue"] {
            --primary-color: #1a73e8;
            --secondary-color: #8ab4f8;
            --bg-gradient-start: #e8f0fe;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #202124;
            --border-color: #1a73e8;
            --btn-radius: 50px;
            --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        [data-theme="black-gold"] {
            --primary-color: #ffd700;
            --secondary-color: #1a1a1a;
            --bg-gradient-start: #0a0a0a;
            --bg-gradient-end: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-color: #ffffff;
            --border-color: #ffd700;
            --btn-radius: 8px;
            --btn-shadow: 0 8px 0 rgba(0,0,0,0.3);
        }

        [data-theme="green"] {
            --primary-color: #2e7d32;
            --secondary-color: #a5d6a7;
            --bg-gradient-start: #e8f5e9;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #1b5e20;
            --border-color: #4caf50;
            --btn-radius: 50px;
            --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        [data-theme="red"] {
            --primary-color: #c62828;
            --secondary-color: #ef9a9a;
            --bg-gradient-start: #ffebee;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #b71c1c;
            --border-color: #f44336;
            --btn-radius: 50px;
            --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        [data-theme="purple"] {
            --primary-color: #6a1b9a;
            --secondary-color: #ce93d8;
            --bg-gradient-start: #f3e5f5;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #4a148c;
            --border-color: #ab47bc;
            --btn-radius: 30px;
            --btn-shadow: inset 0 2px 5px rgba(255,255,255,0.5), 0 5px 15px rgba(106,27,154,0.3);
        }

        [data-theme="orange"] {
            --primary-color: #e65100;
            --secondary-color: #ffb74d;
            --bg-gradient-start: #fff3e0;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #bf360c;
            --border-color: #ff9800;
            --btn-radius: 4px;
            --btn-shadow: 0 10px 20px rgba(230,81,0,0.3);
        }

        [data-theme="cyan"] {
            --primary-color: #00838f;
            --secondary-color: #80deea;
            --bg-gradient-start: #e0f7fa;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #004d40;
            --border-color: #00acc1;
            --btn-radius: 30px;
            --btn-shadow: 0 5px 15px rgba(0,131,143,0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(254, 189, 17, 0.08) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(0, 82, 159, 0.08) 0%, transparent 30%);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ==================== */
        /*   Admin Gear Icon    */
        /* ==================== */
        .admin-gear {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 9999;
            cursor: pointer;
            background: var(--primary-color);
            color: var(--secondary-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            border: 2px solid var(--secondary-color);
            transition: all 0.3s;
        }

        .admin-gear:hover {
            transform: rotate(90deg);
            background: var(--secondary-color);
            color: var(--primary-color);
        }

        /* وضع الصيانة */
        .maintenance-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient-start);
            z-index: 9998;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12vw;
            color: var(--primary-color);
            text-shadow: 0 0 30px var(--secondary-color);
        }

        .main-content {
            transition: opacity 0.2s;
        }
        .main-content.hidden {
            display: none;
        }

        /* ==================== */
        /*    Login Modal       */
        /* ==================== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .login-box, .admin-panel {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border: 3px solid var(--secondary-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .admin-panel {
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .login-box h2, .admin-panel h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .login-box input, .admin-panel input, .admin-panel textarea, .admin-panel select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            margin-bottom: 15px;
            font-family: 'Cairo';
            background: var(--card-bg);
            color: var(--text-color);
        }

        .admin-panel textarea {
            border-radius: 20px;
            resize: vertical;
        }

        .login-box button, .admin-panel button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: var(--btn-radius);
            font-weight: bold;
            cursor: pointer;
            border: 1px solid var(--secondary-color);
            font-family: 'Cairo';
            margin: 5px;
            transition: 0.3s;
            box-shadow: var(--btn-shadow);
        }

        .login-box button:hover, .admin-panel button:hover {
            background: var(--secondary-color);
            color: black;
        }

        .close-btn {
            background: #ccc !important;
            color: #333 !important;
        }

        /* ==================== */
        /*    Admin Panel       */
        /* ==================== */
        .app-list-item, .mod-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.05);
            padding: 10px 15px;
            border-radius: 50px;
            margin-bottom: 10px;
            border: 1px solid var(--secondary-color);
        }

        .app-list-item span, .mod-list-item span {
            font-weight: bold;
            color: var(--primary-color);
            flex: 1;
            text-align: right;
        }

        .app-list-actions {
            display: flex;
            gap: 5px;
        }

        .edit-app-btn {
            background: #28a745 !important;
            color: white !important;
            padding: 5px 12px !important;
            font-size: 0.9rem;
            margin: 0 !important;
        }

        .delete-app-btn, .delete-mod-btn {
            background: #dc3545 !important;
            color: white !important;
            padding: 5px 12px !important;
            font-size: 0.9rem;
            margin: 0 !important;
        }

        .section-title {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 5px;
            margin: 20px 0 15px;
        }

        /* نموذج التعديل */
        .edit-form-container, .settings-form-container, .moderators-container {
            background: rgba(0,0,0,0.03);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid var(--secondary-color);
        }

        .edit-form-container h3 {
            color: var(--primary-color);
            margin-top: 0;
        }

        /* ==================== */
        /*       Header         */
        /* ==================== */
        header {
            text-align: center;
            padding: 30px 0 20px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
            border-bottom: 2px solid var(--secondary-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        #storeLogo {
            width: 70px;
            filter: drop-shadow(0 5px 15px rgba(254, 189, 17, 0.3));
            transition: transform 0.3s;
        }
        
        #storeLogo:hover {
            transform: scale(1.05);
        }

        #storeName {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-color) 0%, color-mix(in srgb, var(--primary-color) 70%, black) 50%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sub-brand {
            font-size: 14px;
            letter-spacing: 5px;
            color: var(--primary-color);
            font-weight: 800;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* ==================== */
        /*     Info Pill        */
        /* ==================== */
        .info-pill {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border: 1.5px solid var(--secondary-color);
            border-radius: 100px;
            padding: 15px 25px;
            margin: 25px auto;
            display: flex;
            gap: 15px;
            width: 95%;
            max-width: 900px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
        }

        #liveClock {
            color: var(--primary-color);
            font-weight: 900;
            font-family: 'monospace';
            font-size: 1.3rem;
        }

        #liveDate {
            color: var(--text-color);
            font-weight: 700;
            background: rgba(254, 189, 17, 0.15);
            padding: 5px 15px;
            border-radius: 50px;
        }

        .dhikr {
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.1rem;
        }

        /* ==================== */
        /*        Tabs          */
        /* ==================== */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .tab-btn {
            flex: 1;
            max-width: 250px;
            background: var(--card-bg);
            border: 2px solid var(--secondary-color);
            color: var(--primary-color);
            padding: 15px 20px;
            border-radius: var(--btn-radius);
            cursor: pointer;
            font-family: 'Cairo';
            font-weight: 800;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: var(--btn-shadow);
        }

        .tab-btn.active,
        .tab-btn:focus {
            background: var(--primary-color);
            color: white;
            border-color: var(--secondary-color);
            transform: scale(1.02);
        }

        /* ==================== */
        /*        Grid          */
        /* ==================== */
        .grid {
            display: grid;
            gap: 25px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ==================== */
        /*        Cards         */
        /* ==================== */
        .card {
            background: var(--card-bg);
            border: 2px solid var(--secondary-color);
            border-radius: 24px;
            padding: 25px 20px 20px;
            text-align: center;
            position: relative;
            transition: all 0.4s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            outline: none;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
        }

        .card:hover,
        .card:focus {
            transform: translateY(-8px);
            border-color: var(--primary-color);
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.2);
        }

        .store-card {
            background: linear-gradient(145deg, var(--card-bg), rgba(0,0,0,0.02)) !important;
            border: 2px solid var(--primary-color) !important;
        }

        .app-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.02);
            border-radius: 20px;
            padding: 12px;
            border: 2px solid var(--secondary-color);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .app-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-color), color-mix(in srgb, var(--primary-color) 70%, black));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .desc {
            font-size: 0.95rem;
            color: var(--text-color);
            opacity: 0.8;
            margin-bottom: 15px;
            min-height: 40px;
            font-weight: 500;
        }

        /* ==================== */
        /*       Buttons        */
        /* ==================== */
        .luxury-btn {
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 14px;
            border-radius: var(--btn-radius);
            font-weight: 800;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            outline: none;
            border: 1px solid var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--btn-shadow);
        }

        .card:hover .luxury-btn,
        .card:focus .luxury-btn {
            background: var(--secondary-color);
            color: black;
            border-color: white;
        }

        .instant-btn {
            background: var(--secondary-color) !important;
            color: black !important;
            border: 2px solid white !important;
            font-weight: 900 !important;
        }

        .premiere-btn {
            background: var(--secondary-color) !important;
            color: black !important;
            border: 2px solid white !important;
            font-weight: 900 !important;
        }

        /* ==================== */
        /*    Timer Overlay     */
        /* ==================== */
        .timer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-color);
            opacity: 0.97;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 100;
            border-radius: 24px;
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            border: 2px solid var(--secondary-color);
        }

        .prayer-msg {
            font-size: 1.2rem;
            color: white;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .count-down {
            font-size: 4rem;
            font-weight: 900;
            color: var(--secondary-color);
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* ==================== */
        /*       Footer         */
        /* ==================== */
        footer {
            text-align: center;
            padding: 30px 20px 20px;
            margin-top: 40px;
            border-top: 2px solid var(--secondary-color);
            color: var(--primary-color);
            background: linear-gradient(to top, rgba(254, 189, 17, 0.05), transparent);
        }
        
        footer p {
            margin: 5px 0;
            font-weight: 700;
        }
    </style>
</head>
<body data-theme="madrid">

    <!-- ==================== -->
    <!--   Admin Gear Button  -->
    <!-- ==================== -->
    <div class="admin-gear" onclick="openLoginModal()">
        <i class="fas fa-cog"></i>
    </div>

    <!-- وضع الصيانة -->
    <div id="maintenanceOverlay" class="maintenance-overlay" style="display: none;">⚠️</div>

    <!-- المحتوى الرئيسي -->
    <div id="mainContent" class="main-content">
        <header>
            <div class="logo-container">
                <img id="storeLogo" src="https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png" alt="Logo">
            </div>
            <h1 class="brand" id="storeName">HDMosul Store</h1>
            <div class="sub-brand">VIP EXCLUSIVE</div>
        </header>

        <div class="info-pill">
            <div id="liveClock">00:00:00 PM</div>
            <div id="liveDate">التاريخ</div>
            <div class="dhikr">⚽ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ⚽</div>
        </div>

        <div class="tabs-container">
            <button class="tab-btn active" onclick="switchTab(event, 'apps-tab')">💎 الكل</button>
            <button class="tab-btn" onclick="switchTab(event, 'store-tab')">🏆 المتجر</button>
        </div>

        <div id="apps-tab" class="tab-content"><div class="grid" id="appsGrid"></div></div>
        <div id="store-tab" class="tab-content" style="display: none;"><div class="grid" id="storeGrid"></div></div>

        <footer>
            <p id="footerLine1">HDMosul • PREMIUM STORE • 2026</p>
            <p id="footerLine2">جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <!-- ==================== -->
    <!--   Login Modal        -->
    <!-- ==================== -->
    <div id="loginModal" class="modal-overlay">
        <div class="login-box">
            <h2><i class="fas fa-lock"></i> لوحة التحكم</h2>
            <input type="password" id="passwordInput" placeholder="أدخل رمز الدخول" onkeypress="if(event.key==='Enter')checkPassword()">
            <div>
                <button onclick="checkPassword()">دخول</button>
                <button class="close-btn" onclick="closeLoginModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- ==================== -->
    <!--   Admin Panel Modal  -->
    <!-- ==================== -->
    <div id="adminPanelModal" class="modal-overlay">
        <div class="admin-panel">
            <h2 id="panelTitle"><i class="fas fa-tools"></i> لوحة التحكم</h2>
            
            <!-- إعدادات المتجر (للمالك فقط) -->
            <div id="storeSettingsSection" style="display: none;">
                <div class="section-title">⚙️ إعدادات المتجر</div>
                <div class="settings-form-container">
                    <input type="text" id="settingsStoreName" placeholder="اسم المتجر">
                    <input type="text" id="settingsLogoUrl" placeholder="رابط الشعار">
                    <input type="text" id="settingsBrandName" placeholder="العلامة التجارية (تظهر في وصف التطبيقات)">
                    <input type="text" id="settingsFooter1" placeholder="نص الفوتر - السطر الأول">
                    <input type="text" id="settingsFooter2" placeholder="نص الفوتر - السطر الثاني">
                    <select id="settingsTheme">
                        <option value="madrid">مدريدي (أزرق وذهبي)</option>
                        <option value="blue">أزرق عصري</option>
                        <option value="black-gold">أسود وذهبي</option>
                        <option value="green">أخضر زمردي</option>
                        <option value="red">أحمر ملكي</option>
                        <option value="purple">بنفسجي فاخر</option>
                        <option value="orange">برتقالي حيوي</option>
                        <option value="cyan">سماوي هادئ</option>
                    </select>
                    <div style="margin-top:10px;">
                        <label style="display:flex; align-items:center; gap:10px;">
                            <input type="checkbox" id="settingsMaintenanceMode"> تفعيل وضع الصيانة (⚠️)
                        </label>
                    </div>
                    <button onclick="saveStoreSettings()"><i class="fas fa-save"></i> حفظ الإعدادات</button>
                </div>
            </div>

            <!-- إدارة المشرفين (للمالك فقط) -->
            <div id="moderatorsSection" style="display: none;">
                <div class="section-title">👥 إدارة المشرفين</div>
                <div class="moderators-container">
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="text" id="newModeratorCode" placeholder="رمز المشرف الجديد (أرقام فقط)" style="flex: 1;">
                        <button onclick="addModerator()"><i class="fas fa-plus"></i> إضافة</button>
                    </div>
                    <div id="moderatorsList" style="max-height: 200px; overflow-y: auto;"></div>
                </div>
            </div>

            <!-- نموذج التعديل -->
            <div id="editFormContainer" class="edit-form-container" style="display: none;">
                <h3><i class="fas fa-pen"></i> تعديل التطبيق</h3>
                <input type="hidden" id="editAppIndex">
                <input type="hidden" id="editAppType">
