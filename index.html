    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

        /* ================ المتغيرات ================ */
        :root {
            --primary-color: #00529f;
            --secondary-color: #febd11;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #0a1a2b;
            --border-color: #febd11;
        }

        [data-theme="madrid"] {
            --primary-color: #00529f;
            --secondary-color: #febd11;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #0a1a2b;
            --border-color: #febd11;
        }

        [data-theme="blue"] {
            --primary-color: #1a73e8;
            --secondary-color: #8ab4f8;
            --bg-gradient-start: #e8f0fe;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #202124;
            --border-color: #1a73e8;
        }

        [data-theme="black-gold"] {
            --primary-color: #ffd700;
            --secondary-color: #1a1a1a;
            --bg-gradient-start: #0a0a0a;
            --bg-gradient-end: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-color: #ffffff;
            --border-color: #ffd700;
        }

        [data-theme="green"] {
            --primary-color: #2e7d32;
            --secondary-color: #a5d6a7;
            --bg-gradient-start: #e8f5e9;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #1b5e20;
            --border-color: #4caf50;
        }

        [data-theme="red"] {
            --primary-color: #c62828;
            --secondary-color: #ef9a9a;
            --bg-gradient-start: #ffebee;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #b71c1c;
            --border-color: #f44336;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(254, 189, 17, 0.08) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(0, 82, 159, 0.08) 0%, transparent 30%);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .admin-gear {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            cursor: pointer;
            background: var(--primary-color);
            color: var(--secondary-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            border: 2px solid var(--secondary-color);
            transition: all 0.3s;
        }

        .admin-gear:hover {
            transform: rotate(90deg);
            background: var(--secondary-color);
            color: var(--primary-color);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .login-box, .admin-panel {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border: 3px solid var(--secondary-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center;
        }

        .admin-panel {
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .login-box h2, .admin-panel h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .login-box input, .admin-panel input, .admin-panel textarea, .admin-panel select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 50px;
            font-size: 1rem;
            margin-bottom: 15px;
            font-family: 'Cairo';
            background: var(--card-bg);
            color: var(--text-color);
        }

        .admin-panel textarea {
            border-radius: 20px;
            resize: vertical;
        }

        .login-box button, .admin-panel button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid var(--secondary-color);
            font-family: 'Cairo';
            margin: 5px;
            transition: 0.3s;
        }

        .login-box button:hover, .admin-panel button:hover {
            background: var(--secondary-color);
            color: black;
        }

        .close-btn {
            background: #ccc !important;
            color: #333 !important;
        }

        .app-list-item, .mod-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.05);
            padding: 10px 15px;
            border-radius: 50px;
            margin-bottom: 10px;
            border: 1px solid var(--secondary-color);
        }

        .app-list-item span, .mod-list-item span {
            font-weight: bold;
            color: var(--primary-color);
            flex: 1;
            text-align: right;
        }

        .app-list-actions {
            display: flex;
            gap: 5px;
        }

        .edit-app-btn {
            background: #28a745 !important;
            color: white !important;
            padding: 5px 12px !important;
            font-size: 0.9rem;
            margin: 0 !important;
        }

        .delete-app-btn, .delete-mod-btn {
            background: #dc3545 !important;
            color: white !important;
            padding: 5px 12px !important;
            font-size: 0.9rem;
            margin: 0 !important;
        }

        .section-title {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 5px;
            margin: 20px 0 15px;
        }

        .edit-form-container, .settings-form-container, .moderators-container {
            background: rgba(0,0,0,0.03);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid var(--secondary-color);
        }

        header {
            text-align: center;
            padding: 30px 0 20px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
            border-bottom: 2px solid var(--secondary-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        #storeLogo {

            transition: transform 0.3s;
        }

        }

            margin: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .sub-brand {
            font-size: 14px;
            letter-spacing: 5px;
            color: var(--primary-color);
            font-weight: 800;
            opacity: 0.9;
            margin-top: 5px;
        }

        .info-pill {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border: 1.5px solid var(--secondary-color);
            border-radius: 100px;

            margin: 25px auto;
            display: flex;
            gap: 15px;
            width: 95%;
            max-width: 900px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
        }

            color: var(--primary-color);
            font-weight: 900;
            font-family: 'monospace';
            font-size: 1.3rem;
        }

            color: var(--text-color);
            font-weight: 700;
            background: rgba(254, 189, 17, 0.15);
            padding: 5px 15px;
            border-radius: 50px;
        }

        .dhikr {
            color: var(--primary-color);
            font-weight: 800;
            font-size: 1.1rem;
        }

        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .tab-btn {
            flex: 1;
            max-width: 250px;
            background: var(--card-bg);
            border: 2px solid var(--secondary-color);
            color: var(--primary-color);
            padding: 15px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);

            background: var(--primary-color);
            color: white;
            border-color: var(--secondary-color);
            transform: scale(1.02);
        }

            display: grid;
            gap: 25px;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--secondary-color);
            border-radius: 24px;
            padding: 25px 20px 20px;
            text-align: center;
            position: relative;
            transition: all 0.4s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            outline: none;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
        }

        .card:hover,
        .card:focus {
            transform: translateY(-8px);
            border-color: var(--primary-color);
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.2);
        }

        .store-card {
            background: linear-gradient(145deg, var(--card-bg), rgba(0,0,0,0.02)) !important;
            border: 2px solid var(--primary-color) !important;
        }

        .app-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.02);
            border-radius: 20px;
            padding: 12px;
            border: 2px solid var(--secondary-color);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        .app-icon img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-color), color-mix(in srgb, var(--primary-color) 70%, black));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .desc {
            font-size: 0.95rem;
            color: var(--text-color);
            opacity: 0.8;
            margin-bottom: 15px;
            min-height: 40px;
            font-weight: 500;
        }

        .luxury-btn {
            background: var(--primary-color);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 50px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            outline: none;
            border: 1px solid var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .card:hover .luxury-btn,
        .card:focus .luxury-btn {
            background: var(--secondary-color);
            color: black;
            border-color: white;
        }

        .instant-btn {
            background: var(--secondary-color) !important;
            color: black !important;
            border: 2px solid white !important;
            font-weight: 900 !important;
        }

        .premiere-btn {
            background: var(--secondary-color) !important;
            color: black !important;
            border: 2px solid white !important;
            font-weight: 900 !important;
        }

            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-color);
            opacity: 0.97;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;

        <div class="section-title">➕ إضافة تطبيق جديد</div>
        <div class="add-app-form">
            <input type="text" id="newAppName" placeholder="اسم التطبيق">
            <textarea id="newAppDesc" placeholder="الوصف" rows="2"></textarea>
            <input type="text" id="newAppLink" placeholder="رابط التحميل">

        </div>

        <div id="appListSection" style="display: none;">
            <div class="section-title">📋 قائمة التطبيقات (تعديل / حذف)</div>
            <div id="appListContainer" style="max-height: 300px; overflow-y: auto; padding: 5px;"></div>
        </div>

        <div style="margin-top: 20px;"><button class="close-btn" onclick="closeAdminPanel()">إغلاق</button></div>
    </div>
</div>

        { name: "تطبيق UXP", desc: "الأفضل لجميع الشبكات • سينمانا ورياضة • HDMosul", link: "https://www.mediafire.com/file/87vqd9o61a5my3d/UXP_2.7.apk/file", icon: "https://cdn-icons-png.flaticon.com/512/6294/6294955.png" },
        { name: "Cinemana CBOX", desc: "نسخة شاشات وتيفي بوكس • شبكة ايرثلنك حصراً • HDMosul", link: "https://github.com/iraqapps/tvapps/raw/refs/heads/main/apps/Cinemana_Leanback%20v4.5.9_New.apk", icon: "https://cdn-icons-png.flaticon.com/512/2910/2910756.png" },
        { name: "Cinemana Plus", desc: "للشاشات الضعيفة • يعمل فقط على ايرثلنك • HDMosul", link: "https://github.com/iraqapps/tvapps/raw/refs/heads/main/apps/cinemanaplustv.apk", icon: "https://cdn-icons-png.flaticon.com/512/1828/1828961.png" }

    const DEFAULT_STORE = [
        { name: "مكتبة التطبيقات (1)", desc: "HDMosul • المتجر المتكامل من Android_AppsX", link: "https://iraqapps.github.io/tvapps/", icon: "https://cdn-icons-png.flaticon.com/512/2232/2232688.png" },
        { name: "مكتبة التطبيقات (2)", desc: "HDMosul • أرشيف شامل لكافة التطبيقات الهامة", link: "https://401740.hala-web.com/", icon: "https://cdn-icons-png.flaticon.com/512/2232/2232688.png" },
        { name: "الدعم الفني", desc: "للإبلاغ عن الأعطال: pqkbgfcn688@gmail.com", link: "mailto:pqkbgfcn688@gmail.com", icon: "https://cdn-icons-png.flaticon.com/512/1827/1827300.png", isSupport: true }
    ];

    let appsList = [], storeList = [], moderators = [];
    let storeSettings = { name: 'HDMosul Store', logoUrl: 'https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png', theme: 'madrid' };
    let currentEdit = { type: null, index: null };

    function loadModerators() {
        const saved = localStorage.getItem('hdmosul_mods');
        moderators = saved ? JSON.parse(saved) : [...DEFAULT_MODS];
    }
    function saveModerators() {
        localStorage.setItem('hdmosul_mods', JSON.stringify(moderators));
        if (currentUserRole === 'owner') renderModeratorsList();
    }
    function loadSettings() {
        const saved = localStorage.getItem('hdmosul_settings');
        if (saved) storeSettings = JSON.parse(saved);
        applySettings();
    }
    function saveSettings() {
        localStorage.setItem('hdmosul_settings', JSON.stringify(storeSettings));
        applySettings();
    }
    function applySettings() {
        document.getElementById('storeName').textContent = storeSettings.name;
        document.getElementById('storeLogo').src = storeSettings.logoUrl;
        document.body.setAttribute('data-theme', storeSettings.theme);
    }
    function loadData() {
        appsList = JSON.parse(localStorage.getItem('hdmosul_apps')) || [...DEFAULT_APPS];
        storeList = JSON.parse(localStorage.getItem('hdmosul_store')) || [...DEFAULT_STORE];
    }
    function saveData() {
        localStorage.setItem('hdmosul_apps', JSON.stringify(appsList));
        localStorage.setItem('hdmosul_store', JSON.stringify(storeList));
        renderAllApps(); renderStoreApps();
    }

    function createAppCard(app, isStore = false) {
        const card = document.createElement('div');
        card.className = `card ${isStore ? 'store-card' : ''}`;
        card.tabIndex = 0;
        if (app.isSupport) {
            card.onclick = () => window.location.href = app.link;
        } else {
            card.onclick = () => openLink(card, app.link);
            card.onkeypress = (e) => { if(e.key === 'Enter') openLink(card, app.link); };
            const overlay = document.createElement('div');
            overlay.className = 'timer-overlay';
            overlay.innerHTML = `<div class="prayer-msg">⚽ لا تجعل المشاهدة تلهيك عن الصلاة وذكر الله ⚽</div><div class="count-down">4</div>`;
            card.appendChild(overlay);
        }
        const iconDiv = document.createElement('div');
        iconDiv.className = 'app-icon';
        const img = document.createElement('img');
        img.src = app.icon || 'https://via.placeholder.com/100/00529f/ffffff?text=APP';
        img.alt = app.name;
        img.onerror = () => img.src = 'https://via.placeholder.com/100/00529f/ffffff?text=APP';
        iconDiv.appendChild(img);
        card.appendChild(iconDiv);
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = app.name;
        card.appendChild(title);
        const desc = document.createElement('div');
        desc.className = 'desc';
        desc.innerHTML = app.desc;
        card.appendChild(desc);
        if (!app.isSupport) {
            if (app.hasPlayer) {
                const btnContainer = document.createElement('div');
                btnContainer.style.cssText = 'display: flex; gap: 10px; position: relative; z-index: 10;';
                const btn1 = document.createElement('button');
                btn1.className = 'luxury-btn';
                btn1.style.cssText = 'flex:1; pointer-events: none;';
                btn1.textContent = 'تحميل التطبيق';
                const btn2 = document.createElement('button');
                btn2.className = 'luxury-btn instant-btn';
                btn2.style.cssText = 'flex:1; pointer-events: auto;';
                btn2.textContent = 'تحميل المشغل';
                btn2.onclick = (e) => { e.stopPropagation(); e.preventDefault(); window.location.href = app.playerLink; };
                btnContainer.appendChild(btn1); btnContainer.appendChild(btn2);
                card.appendChild(btnContainer);
            } else {
                const btn = document.createElement('button');
                btn.className = `luxury-btn ${app.isPremiere ? 'premiere-btn' : ''}`;
                btn.style.pointerEvents = 'none';
                btn.textContent = app.isPremiere ? '🏆 تحميل PREMIERE 🏆' : 'تحميل';
                card.appendChild(btn);
            }
        }
        return card;
    }
    function renderAllApps() {
        const grid = document.getElementById('appsGrid');
        grid.innerHTML = '';
        appsList.forEach(app => grid.appendChild(createAppCard(app, false)));
    }
    function renderStoreApps() {
        const grid = document.getElementById('storeGrid');
        grid.innerHTML = '';
        storeList.forEach(app => grid.appendChild(createAppCard(app, true)));
    }
    function renderModeratorsList() {
        const container = document.getElementById('moderatorsList');
        container.innerHTML = '';
        moderators.forEach((code, i) => {
            const div = document.createElement('div');
            div.className = 'mod-list-item';
            div.innerHTML = `<span>🔑 ${code}</span>`;
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-mod-btn';
            delBtn.innerHTML = '<i class="fas fa-trash"></i> حذف';
            delBtn.onclick = () => { if(confirm(`حذف المشرف ${code}؟`)) { moderators.splice(i,1); saveModerators(); } };
            div.appendChild(delBtn);
            container.appendChild(div);
        });
        if (moderators.length === 0) container.innerHTML = '<p style="text-align:center;">لا يوجد مشرفين</p>';
    }
    function addModerator() {
        const input = document.getElementById('newModeratorCode');
        const code = input.value.trim();
        if (!code) return alert('أدخل الرمز');
        if (!/^\d+$/.test(code)) return alert('أرقام فقط');
        if (code === OWNER_PASS) return alert('لا يمكن إضافة المالك');
        if (moderators.includes(code)) return alert('الرمز موجود مسبقاً');
        moderators.push(code);
        saveModerators();
        input.value = '';
        alert(`تم إضافة المشرف ${code}`);
    }

    function openLoginModal() {
        document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').focus();
    }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
    function checkPassword() {
        const pass = document.getElementById('passwordInput').value;
        if (pass === OWNER_PASS) {
            currentUserRole = 'owner';
            closeLoginModal();
            openAdminPanel();
        } else if (moderators.includes(pass)) {
            currentUserRole = 'moderator';
            closeLoginModal();
            openAdminPanel();
        } else {
            alert('رمز غير صحيح');
        }
    }
    function openAdminPanel() {
        const title = document.getElementById('panelTitle');
        const settingsSec = document.getElementById('storeSettingsSection');
        const modSec = document.getElementById('moderatorsSection');
        const listSec = document.getElementById('appListSection');
        if (currentUserRole === 'owner') {
            title.innerHTML = '<i class="fas fa-crown"></i> لوحة المالك';
            settingsSec.style.display = 'block';
            modSec.style.display = 'block';
            listSec.style.display = 'block';
            document.getElementById('settingsStoreName').value = storeSettings.name;
            document.getElementById('settingsLogoUrl').value = storeSettings.logoUrl;
            document.getElementById('settingsTheme').value = storeSettings.theme;
            renderModeratorsList();
            refreshAppListInPanel();
        } else {
            title.innerHTML = '<i class="fas fa-user-shield"></i> لوحة المشرف';
            settingsSec.style.display = 'none';
            modSec.style.display = 'none';
            listSec.style.display = 'block';
            refreshAppListInPanel();
        }
        document.getElementById('adminPanelModal').style.display = 'flex';
        cancelEdit();
    }
    function closeAdminPanel() {
        document.getElementById('adminPanelModal').style.display = 'none';
        currentUserRole = null;
    }
    function saveStoreSettings() {
        if (currentUserRole !== 'owner') return;
        storeSettings.name = document.getElementById('settingsStoreName').value.trim() || 'HDMosul Store';
        storeSettings.logoUrl = document.getElementById('settingsLogoUrl').value.trim() || storeSettings.logoUrl;
        storeSettings.theme = document.getElementById('settingsTheme').value;
        saveSettings();
        alert('تم حفظ الإعدادات');
    }

    function refreshAppListInPanel() {
        const container = document.getElementById('appListContainer');
        container.innerHTML = '';
        let appsToShow = (currentUserRole === 'owner') ? appsList : appsList.filter(app => app.addedBy === currentUserRole);
        appsToShow.forEach(app => {
            const originalIndex = appsList.indexOf(app);
            container.appendChild(createListItem(app.name, 'apps', originalIndex));
        });
        if (currentUserRole === 'owner') {
            const sep = document.createElement('div');
            sep.style.margin = '15px 0 5px';
            sep.style.fontWeight = 'bold';
            sep.textContent = '📁 المتجر:';
            container.appendChild(sep);
            storeList.forEach((app, i) => container.appendChild(createListItem(app.name, 'store', i)));
        }
    }
    function createListItem(name, type, index) {
        const div = document.createElement('div');
        div.className = 'app-list-item';
        div.innerHTML = `<span>${name}</span>`;
        const actions = document.createElement('div');
        actions.className = 'app-list-actions';
        const editBtn = document.createElement('button');
        editBtn.className = 'edit-app-btn';
        editBtn.innerHTML = '<i class="fas fa-edit"></i> تعديل';
        editBtn.onclick = () => startEdit(type, index);
        const delBtn = document.createElement('button');
        delBtn.className = 'delete-app-btn';
        delBtn.innerHTML = '<i class="fas fa-trash"></i> حذف';
        delBtn.onclick = () => {
            if (confirm(`حذف "${name}"؟`)) {
                if (type === 'apps') appsList.splice(index, 1);
                else storeList.splice(index, 1);
                saveData();
                refreshAppListInPanel();
                cancelEdit();
            }
        };
        actions.appendChild(editBtn); actions.appendChild(delBtn);
        div.appendChild(actions);
        return div;
    }
    function startEdit(type, index) {
        currentEdit = { type, index };
        const app = type === 'apps' ? appsList[index] : storeList[index];
        document.getElementById('editAppIndex').value = index;
        document.getElementById('editAppType').value = type;
        document.getElementById('editAppName').value = app.name || '';
        document.getElementById('editAppDesc').value = app.desc || '';
        document.getElementById('editAppLink').value = app.link || '';
        document.getElementById('editAppIcon').value = app.icon || '';
        document.getElementById('editFormContainer').style.display = 'block';
    }
    function saveEdit() {
        const type = document.getElementById('editAppType').value;
        const index = parseInt(document.getElementById('editAppIndex').value);
        const updated = {
            name: document.getElementById('editAppName').value.trim(),
            desc: document.getElementById('editAppDesc').value.trim(),
            link: document.getElementById('editAppLink').value.trim(),
            icon: document.getElementById('editAppIcon').value.trim()
        };
        if (!updated.name || !updated.link) return alert('الاسم والرابط مطلوبان');
        const original = type === 'apps' ? appsList[index] : storeList[index];
        const final = { ...original, ...updated };
        if (type === 'apps') appsList[index] = final;
        else storeList[index] = final;
        saveData();
        refreshAppListInPanel();
        cancelEdit();
        alert('تم التحديث');
    }
    function cancelEdit() {
        document.getElementById('editFormContainer').style.display = 'none';
        currentEdit = { type: null, index: null };
    }
    function addNewApp() {
        const name = document.getElementById('newAppName').value.trim();
        const desc = document.getElementById('newAppDesc').value.trim();
        const link = document.getElementById('newAppLink').value.trim();
        const icon = document.getElementById('newAppIcon').value.trim();
        if (!name || !link) return alert('الاسم والرابط مطلوبان');
        const newApp = {
            name, desc: desc || 'تطبيق جديد', link,
            icon: icon || 'https://cdn-icons-png.flaticon.com/512/1828/1828961.png',
            addedBy: currentUserRole
        };
        appsList.push(newApp);
        saveData();
        refreshAppListInPanel();
        ['newAppName','newAppDesc','newAppLink','newAppIcon'].forEach(id => document.getElementById(id).value = '');
        alert(`تمت إضافة ${name}`);
    }

    function updateClock() {
        const now = new Date();
        let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
        const ampm = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        document.getElementById('liveClock').innerText = `${h}:${m<10?'0'+m:m}:${s<10?'0'+s:s} ${ampm}`;
        const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
        const d = days[now.getDay()];
        const y = now.getFullYear(), mo = now.getMonth()+1, da = now.getDate();
        document.getElementById('liveDate').innerText = `${d} ${y}-${mo}-${da}`;
    }
    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).style.display = 'block';
        evt.currentTarget.classList.add('active');
    }
    function openLink(card, url) {
        if (card.dataset.running === "true") return;
        const overlay = card.querySelector('.timer-overlay');
        if (!overlay) { window.location.href = url; return; }
        const countSpan = overlay.querySelector('.count-down');
        card.dataset.running = "true";
        let count = 4;
        overlay.style.display = 'flex';
        countSpan.innerText = count;
        const interval = setInterval(() => {
            count--;
            countSpan.innerText = count;
            if (count <= 0) {
                clearInterval(interval);
                overlay.style.display = 'none';
                card.dataset.running = "false";
                window.location.href = url;
            }
        }, 1000);
    }

    window.openLoginModal = openLoginModal;
    window.closeLoginModal = closeLoginModal;
    window.checkPassword = checkPassword;
    window.closeAdminPanel = closeAdminPanel;
    window.saveStoreSettings = saveStoreSettings;
    window.addModerator = addModerator;
    window.addNewApp = addNewApp;
    window.saveEdit = saveEdit;
    window.cancelEdit = cancelEdit;
    window.switchTab = switchTab;
    
    window.onload = function() {
        loadModerators();
        loadSettings();
        loadData();
        renderAllApps();
        renderStoreApps();
        updateClock();
        setInterval(updateClock, 1000);
    };
})();
</script>
