<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDMosul Store</title>
<style>
body{
  margin:0;
  font-family:sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#fff;
  flex-direction:column;
}
.card{
  width:600px;
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(15px);
  padding:40px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  margin-bottom:20px;
}
.logo{
  font-size:48px;
  font-weight:900;
  background:linear-gradient(90deg,#0d6efd,#6610f2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}
.sublogo{
  font-size:20px;
  color:#ffc107;
  margin-bottom:30px;
}
.maint{
  padding:30px;
  border-radius:20px;
  background:rgba(255,193,7,.1);
  border:1px solid rgba(255,193,7,.4);
  font-size:28px;
  margin-bottom:20px;
}
.count{
  margin-top:15px;
  font-size:36px;
  color:#ffc107;
  font-weight:bold;
}
.download{
  margin-top:20px;
}
.btn1{background:#25D366;}
.btn1:hover{background:#1ebe57;}
.btn2{background:#0d6efd;}
.btn2:hover{background:#0b5ed7;}
.btn3{background:#6610f2;}
.btn3:hover{background:#520dc2;}
.download a{
  display:block;
  margin:10px auto;
  padding:15px 25px;
  font-size:22px;
  font-weight:bold;
  color:#fff;
  border-radius:12px;
  text-decoration:none;
  transition:0.3s;
  width:80%;
}
.activation{
  margin-top:10px;
  font-size:18px;
  color:#fff;
  background:rgba(0,0,0,.2);
  display:inline-block;
  padding:8px 15px;
  border-radius:8px;
}
.note{
  margin-top:8px;
  font-size:16px;
  color:#ffc107;
}
.desc{
  margin-top:5px;
  font-size:15px;
  color:#ccc;
}
.footer{
  width:100%;
  overflow:hidden;
  background:rgba(0,0,0,.2);
  white-space:nowrap;
  box-sizing:border-box;
  padding:10px 0;
  margin-top:10px;
}
.marquee{
  display:inline-block;
  padding-left:100%;
  animation: move 30s linear infinite;
  font-size:24px;
  color:#ffc107;
}
@keyframes move{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">HDMosul Store</div>
  <div class="sublogo">متجر تجريبي - كود التفعيل: 2026</div>

  <div class="maint">
    ⚠️ الموقع تحت الصيانة
    <div class="count" id="c"></div>
  </div>

  <div class="download">
    
    <a class="btn1" href="https://www.mediafire.com/file/wi2ngm2mohy0ust/PrimeTV+v1.6.0.apk/file" target="_blank">
      تحميل تطبيق هلي برايم TV
    </a>
    <div class="activation">كود التفعيل: 2026</div>

    <a class="btn2" href="https://www.mediafire.com/file/f5bayroe9arsszp/%D8%B3%D9%8A%D9%86%D9%85%D8%A7%D9%86%D8%A7+TV.apk/file" target="_blank">
      تحميل سينمانا شاشة
    </a>
    <div class="note">يعمل على: ايرثلنك + كيبل ضوئي</div>

    <a class="btn3" href="https://mega.nz/file/RMsH3AYZ#P7JESgsIhKIkz_gN6_ghpKMOizb54mkBocz-Yktb6cA" target="_blank">
      تحميل سينمانا لينباك
    </a>
    <div class="desc">النسخة المخصصة للشاشات وأجهزة تيفي بوكس سريعة جدا</div>

  </div>
</div>

<div class="footer">
  <div class="marquee">الحمد لله | سبحان الله | الحمد لله | سبحان الله</div>
</div>

</body>
</html>
