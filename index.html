<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HDMosul Store - VIP Global LUXURY</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
--royal-gold: linear-gradient(135deg, #c5a059 0%, #fff2a1 50%, #ad7a27 100%);
--metallic-gold: #d4af37;
--deep-black: #050505;
--glass-bg: rgba(255, 255, 255, 0.03);
--card-shadow: 0 15px 35px rgba(0,0,0,0.5);
--gold-glow: 0 0 15px rgba(212, 175, 55, 0.2);
--telegram-blue: linear-gradient(135deg, #24A1DE 0%, #0088cc 100%);
}body { margin: 0; padding: 0; font-family: 'Cairo', sans-serif; background-color: var(--deep-black); background-image: radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 20%), radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 20%); color: #e0e0e0; min-height: 100vh; overflow-x: hidden; }

header { text-align: center; padding: 40px 0 20px; background: linear-gradient(to bottom, rgba(212,175,55,0.05), transparent); position: relative; }

.maintenance-badge{ position:absolute; top:10px; left:10px; background: var(--royal-gold); color:#000; font-weight:900; padding:8px 15px; border-radius:12px; box-shadow: var(--gold-glow); }

.logo { width: 85px; filter: drop-shadow(0 0 15px #d4af37); margin-bottom: 15px; transition: transform 0.5s ease; } .logo:hover { transform: rotateY(360deg); }

.brand { font-size: 3rem; font-weight: 900; background: var(--royal-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; letter-spacing: -1px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }

.sub-brand { font-size: 12px; letter-spacing: 8px; color: var(--metallic-gold); text-transform: uppercase; font-weight: 700; opacity: 0.9; }

.info-pill { display:none; }

.tabs-container { display: flex; justify-content: center; gap: 15px; margin: 30px auto; padding: 0 20px; max-width: 600px; }

.tab-btn { flex: 1; background: rgba(255,255,255,0.02); border: 1px solid rgba(212, 175, 55, 0.2); color: #aaa; padding: 15px 20px; border-radius: 15px; cursor: pointer; font-family: 'Cairo'; font-weight: 700; font-size: 1.1rem; transition: all 0.3s; }

.tab-btn.active { background: var(--royal-gold); color:#000; }

.grid { display: grid; gap: 25px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); padding: 20px; }

.card { background: linear-gradient(145deg, #121212 0%, #080808 100%); border: 1px solid rgba(212, 175, 55, 0.15); border-radius: 24px; padding: 30px 20px; text-align: center; position: relative; box-shadow: var(--card-shadow); }

.icon { font-size: 3rem; margin-bottom: 15px; } .title { font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; color:#fff; } .desc { font-size: 0.9rem; color:#aaa; line-height:1.6; }

.maintenance-note{ margin-top:12px; color:#fff2a1; font-weight:700; background: rgba(212,175,55,0.08); padding:10px; border-radius:10px; border:1px solid rgba(212,175,55,0.2); }

.dual-btn-container { display:flex; gap:10px; margin-top:18px; } .download-sub-btn { flex:1; background: rgba(212,175,55,0.1); border:1px solid var(--metallic-gold); color:#fff; padding:12px; border-radius:12px; font-weight:bold; cursor:pointer; }

footer { text-align:center; padding:50px 20px; margin-top:40px; } </style>

</head>
<body><header>
<div class="maintenance-badge">🛠️ الموقع تحت الصيانة</div>
<img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" class="logo" alt="logo">
<h1 class="brand">HDMosul Store</h1>
<div class="sub-brand">👑 V I P • E X C L U S I V E 👑</div>
</header><div class="tabs-container">
<button class="tab-btn active">💎 الكل</button>
<button class="tab-btn">🏪 المتجر الملكي</button>
</div><div class="main-container" style="max-width:1300px;margin:0 auto;">
<div class="grid"><div class="card" onclick="maintenanceMsg()">
<div class="icon">🇮🇶</div>
<div class="title">واحد بغداد TV</div>
<div class="desc">HDMosul</div>
<div class="maintenance-note">⏳ جاري تحديث روابط التحميل بشكل فخم جداً</div>
</div><div class="card" style="cursor:default;">
<div class="icon">🔥</div>
<div class="title">تطبيقات بمشغل</div>
<div class="desc">هذه التطبيقات تعمل بشكل طبيعي بدون تغيير</div>
<div class="dual-btn-container">
<button class="download-sub-btn" onclick="directOpen('#')">تحميل</button>
<button class="download-sub-btn" onclick="directOpen('#')">المشغل</button>
</div>
</div><div class="card" onclick="maintenanceMsg()">
<div class="icon">🎬</div>
<div class="title">باقي التطبيقات</div>
<div class="desc">تم إيقاف التحميل مؤقتاً</div>
<div class="maintenance-note">🛠️ جاري تحديث روابط التحميل</div>
</div></div>
</div><footer>
HDMosul • MAINTENANCE MODE
</footer><script>
function maintenanceMsg(){
alert('🚧 روابط التحميل قيد التحديث حالياً');
}

function directOpen(url){
if(url && url !== '#') window.open(url,'_blank');
}
</script></body>
</html>
