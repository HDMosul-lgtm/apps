<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر HDMosul</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --dark: #1a1a1a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--dark); }
        .card { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); text-align: center; }
        .logo { font-size: 32px; font-weight: 800; color: var(--primary); margin-bottom: 10px; letter-spacing: -1px; }
        .dua { color: #666; font-size: 14px; margin-bottom: 25px; font-style: italic; }
        .wa-box { background: #f0f9ff; border-radius: 15px; padding: 15px; margin-bottom: 25px; border: 1px solid #e0f2fe; }
        .wa-box p { margin: 0 0 10px 0; font-size: 14px; font-weight: 600; }
        .wa-link { color: var(--success); text-decoration: none; font-weight: bold; font-size: 17px; display: block; }
        .app-item { border-top: 1px solid #eee; padding-top: 20px; }
        .app-name { display: block; font-weight: 700; margin-bottom: 15px; font-size: 18px; }
        .dl-btn { background: var(--dark); color: white; text-decoration: none; padding: 14px 0; border-radius: 12px; display: block; font-weight: 600; transition: 0.3s; }
        .dl-btn:hover { background: var(--primary); transform: translateY(-2px); }
        .footer-note { margin-top: 25px; font-size: 13px; color: #aaa; }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">HDMosul</div>
        <div class="dua">لا تنسونا من صالح دعائكم</div>

        <div class="wa-box">
            <p>لطلب أي تطبيق تواصل واتساب وبخدمة الطيبين</p>
            <a href="https://wa.me/9647766780579" class="wa-link">07766780579 🟢</a>
        </div>

        <div class="app-item">
            <span class="app-name">تطبيق سينمانا</span>
            <a href="cinemana.apk" class="dl-btn">تحميل التطبيق</a>
        </div>

        <div class="footer-note">بخدمتكم دائماً</div>
    </div>

</body>
</html>
