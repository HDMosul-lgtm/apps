<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMosul Store - صيانة مؤقتة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --royal-gold: linear-gradient(135deg, #c5a059 0%, #fff2a1 50%, #ad7a27 100%);
            --metallic-gold: #d4af37;
            --deep-black: #0a0a0a;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--deep-black);
            font-family: 'Cairo', sans-serif;
            color: #fff;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.1) 0%, transparent 70%);
        }

        /* الإطار المتحرك الرئيسي */
        .maintenance-container {
            position: relative;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            background: #0f0f0f;
            border-radius: 15px;
            z-index: 1;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        /* تأثير الإطار الذهبي المتحرك */
        .maintenance-container::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            background: linear-gradient(45deg, #ad7a27, #fff2a1, #ad7a27, #5f4111);
            background-size: 400%;
            z-index: -1;
            border-radius: 20px;
            animation: borderRotate 8s linear infinite;
        }

        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* شعار المتجر */
        .brand {
            font-size: 2.5rem;
            font-weight: 900;
            background: var(--royal-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        .sub-brand {
            font-size: 10px;
            letter-spacing: 5px;
            color: var(--metallic-gold);
            margin-bottom: 30px;
            opacity: 0.8;
        }

        /* أيقونة التحميل المكسورة (رسم CSS) */
        .broken-icon {
            width: 80px;
            height: 80px;
            margin: 20px auto;
            position: relative;
            animation: pulse 2s infinite ease-in-out;
        }

        .broken-icon svg {
            fill: url(#gold-grad);
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        /* النصوص */
        .update-title {
            color: #ffcc00;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        .highlight {
            color: var(--metallic-gold);
            font-weight: 700;
        }

        /* تذييل الصفحة */
        .footer-note {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .footer-note span {
            width: 40px;
            height: 1px;
            background: var(--royal-gold);
        }
    </style>
</head>
<body>

    <div class="maintenance-container">
        <h1 class="brand">HDMosul Store</h1>
        <div class="sub-brand">👑 V I P • E X C L U S I V E 👑</div>

        <div class="broken-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#c5a059;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#fff2a1;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#ad7a27;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path d="M19 9h-4V3H9v6H5l7 7 1.5-1.5M12 22v-2m4.5-1.5l-1.5-1.5m-9 0l-1.5 1.5M18 13l3.5 3.5" stroke="url(#gold-grad)" stroke-width="2" stroke-linecap="round" fill="none"/>
                <path d="M5 13l-1.5 1.5" stroke="#ff4444" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="update-title">تحديث تقني طارئ ⚙️</div>

        <div class="message">
            نعتذر لمستخدمينا الكرام، يوجد <span class="highlight">خلل تقني مؤقت</span> في روابط التحميل الجديدة.
            <br>
            <span class="highlight">خلال ساعات قليلة</span> سيعود المتجر للعمل بكامل طاقته وبأداء أفضل.
        </div>

        <div class="message" style="font-size: 0.9rem; opacity: 0.7;">
            فريق العمل يعمل الآن على الإصلاح.. نشكر صبركم وتفهمكم.
        </div>

        <div class="footer-note">
            <span></span>
            فريق HDMosul Store
            <span></span>
        </div>
    </div>

</body>
</html>
