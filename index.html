<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HDMosul Store - VIP Maintenance</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-gradient: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            --deep-black: #080808;
            --soft-gold: #d4af37;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--deep-black);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* طول الشاشة بالضبط */
            width: 100vw;
            font-family: 'Cairo', sans-serif;
            color: #fff;
            overflow: hidden; /* يمنع التمرير نهائياً */
            background-image: radial-gradient(circle at center, #151515 0%, #050505 100%);
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 90%;
            max-width: 600px;
            max-height: 95vh; /* لضمان عدم خروج المحتوى عن الشاشة */
            padding-top: 40px; /* مساحة للتاج */
            animation: fadeIn 1.5s ease-out;
        }

        /* الشعار الملكي - تم تصغيره ليتناسب مع الطول */
        .royal-badge {
            position: relative;
            width: clamp(120px, 25vh, 200px); /* يعتمد الآن على ارتفاع الشاشة vh */
            height: clamp(120px, 25vh, 200px);
            margin: 0 auto 20px;
            padding: 8px;
            background: var(--gold-gradient);
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(184, 134, 11, 0.4);
            animation: float 4s ease-in-out infinite;
        }

        .inner-badge {
            background: #0d0d0d;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .crown-icon {
            position: absolute;
            top: -35px; /* تم تقريب المسافة */
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(40px, 8vh, 60px);
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
            z-index: 10;
        }

        .gear-svg {
            width: 55%;
            fill: var(--soft-gold);
            animation: rotateGear 8s linear infinite;
        }

        .wrench-icon {
            position: absolute;
            font-size: clamp(25px, 5vh, 40px);
            color: #fff;
            z-index: 5;
            animation: wrenchMove 3s ease-in-out infinite;
        }

        .brand-name {
            font-size: clamp(1.5rem, 6vh, 2.5rem);
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 5px 0;
        }

        .coming-soon {
            font-size: clamp(1.2rem, 5vh, 2rem);
            color: #ffffff;
            font-weight: 700;
            margin: 10px 0;
        }

        .sub-text {
            color: #888;
            font-size: clamp(0.8rem, 2.5vh, 1rem);
            line-height: 1.4;
            max-width: 400px;
            margin: 0 auto 20px;
        }

        .footer-line {
            height: 2px;
            width: 50%;
            margin: 0 auto;
            background: var(--gold-gradient);
            opacity: 0.5;
        }

        .footer-tag {
            margin-top: 15px;
            font-weight: 700;
            color: var(--soft-gold);
            font-size: clamp(0.6rem, 2vh, 0.8rem);
            letter-spacing: 2px;
        }

        /* الأنيميشن */
        @keyframes rotateGear { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes wrenchMove { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(20deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="crown-icon">👑</div>

        <div class="royal-badge">
            <div class="inner-badge">
                <svg class="gear-svg" viewBox="0 0 24 24">
                    <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.85,9.48l2.03,1.58C4.84,11.36,4.81,11.69,4.81,12c0,0.31,0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.5c-1.93,0-3.5-1.57-3.5-3.5 s1.57-3.5,3.5-3.5s3.5,1.57,3.5,3.5S13.93,15.5,12,15.5z"/>
                </svg>
                <div class="wrench-icon">🔧</div>
            </div>
        </div>

        <h1 class="brand-name">HDMosul Store</h1>
        <div class="coming-soon">قريباً نعود</div>

        <p class="sub-text">
            نعمل على صيانة الروابط لتقديم أفضل تجربة VIP. نشكر صبركم.
        </p>

        <div class="footer-line"></div>
        <p class="footer-tag">PREMIUM EXPERIENCE • 2026</p>
    </div>

</body>
</html>
