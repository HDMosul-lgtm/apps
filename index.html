<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">HDMosul Store • VIP</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* ================ المتغيرات وتوسيع الثيمات ================ */
        :root {
            --primary-color: #00529f; --secondary-color: #febd11;
            --bg-gradient-start: #f5f7fa; --bg-gradient-end: #ffffff;
            --card-bg: #ffffff; --text-color: #0a1a2b; --border-color: #febd11;
            --btn-radius: 50px; --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        [data-theme="madrid"] { 
            --primary-color: #00529f; --secondary-color: #febd11; --btn-radius: 50px; 
        }
        [data-theme="blue"] { 
            --primary-color: #1a73e8; --secondary-color: #8ab4f8; --bg-gradient-start: #e8f0fe; --btn-radius: 12px;
        }
        [data-theme="black-gold"] { 
            --primary-color: #ffd700; --secondary-color: #1a1a1a; --bg-gradient-start: #0a0a0a; --bg-gradient-end: #1a1a1a; --card-bg: #2a2a2a; --text-color: #ffffff; --btn-radius: 0px; --btn-shadow: 0 0 15px #ffd70044;
        }
        [data-theme="green"] { 
            --primary-color: #2e7d32; --secondary-color: #a5d6a7; --bg-gradient-start: #e8f5e9; --btn-radius: 50px;
        }
        [data-theme="red"] { 
            --primary-color: #c62828; --secondary-color: #ef9a9a; --bg-gradient-start: #ffebee; --btn-radius: 20px; --btn-shadow: 0 10px 20px rgba(198, 40, 40, 0.3);
        }
        [data-theme="purple"] { 
            --primary-color: #6a1b9a; --secondary-color: #e1bee7; --bg-gradient-start: #f3e5f5; --btn-radius: 30px; --btn-shadow: 0 5px 20px rgba(106, 27, 154, 0.4);
        }
        [data-theme="orange"] { 
            --primary-color: #ef6c00; --secondary-color: #ffe0b2; --bg-gradient-start: #fff3e0; --btn-radius: 50px;
        }
        [data-theme="cyan"] { 
            --primary-color: #00838f; --secondary-color: #b2ebf2; --bg-gradient-start: #e0f7fa; --btn-radius: 5px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-color); min-height: 100vh; overflow-x: hidden; position: relative;
        }

        /* وضع الصيانة */
        #maintenanceOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient-start); z-index: 900;
            display: none; align-items: center; justify-content: center; flex-direction: column;
            text-align: center;
        }
        #maintenanceOverlay i { font-size: 80px; color: var(--primary-color); margin-bottom: 20px; }

        .admin-gear {
            position: fixed; top: 20px; left: 20px; z-index: 999; cursor: pointer;
            background: var(--primary-color); color: var(--secondary-color);
            width: 50px; height: 50px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 24px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2); border: 2px solid var(--secondary-color); transition: all 0.3s;
        }
        .admin-gear:hover { transform: rotate(90deg); background: var(--secondary-color); color: var(--primary-color); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 10000;
            display: none; align-items: center; justify-content: center;
        }

        .login-box, .admin-panel {
            background: var(--card-bg); border-radius: 30px; padding: 30px;
            width: 90%; max-width: 400px; border: 3px solid var(--secondary-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center;
        }

        .admin-panel { max-width: 700px; max-height: 85vh; overflow-y: auto; }

        input, textarea, select {
            width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 50px;
            font-size: 1rem; margin-bottom: 15px; font-family: 'Cairo';
            background: var(--card-bg); color: var(--text-color);
        }

        button {
            background: var(--primary-color); color: white; border: none;
            padding: 12px 25px; border-radius: var(--btn-radius); font-weight: bold;
            cursor: pointer; border: 1px solid var(--secondary-color);
            font-family: 'Cairo'; margin: 5px; transition: 0.3s; box-shadow: var(--btn-shadow);
        }

        button:hover { background: var(--secondary-color); color: black; }
        .close-btn { background: #ccc !important; color: #333 !important; }

        .app-list-item {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.05); padding: 10px 15px; border-radius: 50px;
            margin-bottom: 10px; border: 1px solid var(--secondary-color);
        }

        header { text-align: center; padding: 30px 0 20px; border-bottom: 2px solid var(--secondary-color); }
        #storeLogo { width: 70px; transition: transform 0.3s; }
        #storeName { font-size: 3rem; font-weight: 900; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .info-pill {
            background: rgba(255, 255, 255, 0.85); border: 1.5px solid var(--secondary-color);
            border-radius: 100px; padding: 15px 25px; margin: 25px auto;
            display: flex; gap: 15px; width: 95%; max-width: 900px; align-items: center; justify-content: space-evenly; flex-wrap: wrap;
        }

        .tabs-container { display: flex; justify-content: center; gap: 20px; margin: 30px auto; padding: 0 20px; }
        .tab-btn { flex: 1; max-width: 250px; background: var(--card-bg); border: 2px solid var(--secondary-color); color: var(--primary-color); padding: 15px 20px; border-radius: 50px; cursor: pointer; font-weight: 800; transition: 0.3s; }
        .tab-btn.active { background: var(--primary-color); color: white; }

        .grid { display: grid; gap: 25px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); padding: 20px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 2px solid var(--secondary-color); border-radius: 24px; padding: 25px 20px 20px; text-align: center; position: relative; transition: 0.4s; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); }
        .card:hover { transform: translateY(-8px); border-color: var(--primary-color); }

        .app-icon { width: 100px; height: 100px; margin: 0 auto 15px; border-radius: 20px; border: 2px solid var(--secondary-color); padding: 10px; }
        .app-icon img { width: 100%; height: 100%; object-fit: contain; }

        .luxury-btn { background: var(--primary-color); border-radius: var(--btn-radius); box-shadow: var(--btn-shadow); color: white; padding: 14px; font-weight: 800; border: 1px solid var(--secondary-color); margin-top: 10px; }
        .player-btn { background: var(--secondary-color) !important; color: black !important; }

        .timer-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--primary-color); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:100; border-radius:24px; color:white; }
        .count-down { font-size: 4rem; font-weight: 900; color: var(--secondary-color); }

        footer { text-align: center; padding: 30px 20px; border-top: 2px solid var(--secondary-color); color: var(--primary-color); }
    </style>
</head>
<body data-theme="madrid">

<div id="maintenanceOverlay">
    <i class="fas fa-tools"></i>
    <h1 id="maintMsg">المتجر في صيانة حالياً</h1>
    <p>سنعود قريباً جداً...</p>
</div>

<div class="admin-gear" onclick="openLoginModal()"><i class="fas fa-cog"></i></div>

<div id="loginModal" class="modal-overlay">
    <div class="login-box">
        <h2><i class="fas fa-lock"></i> لوحة التحكم</h2>
        <input type="password" id="passwordInput" placeholder="أدخل رمز الدخول">
        <button onclick="checkPassword()">دخول</button>
        <button class="close-btn" onclick="closeLoginModal()">إلغاء</button>
    </div>
</div>

<div id="adminPanelModal" class="modal-overlay">
    <div class="admin-panel">
        <h2 id="panelTitle">لوحة التحكم</h2>
        
        <div id="storeSettingsSection" style="display: none;">
            <div style="background:rgba(0,0,0,0.05); padding:15px; border-radius:20px; margin-bottom:20px; border:1px solid var(--secondary-color);">
                <h3>⚙️ الإعدادات العامة</h3>
                <input type="text" id="settingsStoreName" placeholder="اسم المتجر">
                <input type="text" id="settingsBrandName" placeholder="اسم العلامة التجارية (بديل HDMosul)">
                <input type="text" id="settingsLogoUrl" placeholder="رابط الشعار">
                <input type="text" id="settingsFooter1" placeholder="نص الفوتر 1">
                <input type="text" id="settingsFooter2" placeholder="نص الفوتر 2">
                <select id="settingsTheme">
                    <option value="madrid">مدريدي (الأصلي)</option>
                    <option value="blue">أزرق عصري</option>
                    <option value="black-gold">أسود وذهبي</option>
                    <option value="green">أخضر زمردي</option>
                    <option value="red">أحمر ملكي</option>
                    <option value="purple">بنفسجي فاخر</option>
                    <option value="orange">برتقالي حيوي</option>
                    <option value="cyan">سماوي هادئ</option>
                </select>
                <label style="display:block; margin:10px 0;"><input type="checkbox" id="settingsMaintenance"> تفعيل وضع الصيانة ⚠️</label>
                <button onclick="saveStoreSettings()">حفظ الإعدادات</button>
            </div>
        </div>

        <div id="moderatorsSection" style="display: none;">
            <h3>👥 المشرفين</h3>
            <div style="display:flex; gap:5px;"><input type="text" id="newModCode" placeholder="رمز مشرف جديد"><button onclick="addModerator()">إضافة</button></div>
            <div id="moderatorsList"></div>
        </div>

        <div id="editFormContainer" style="display: none; background:#f9f9f9; padding:15px; border-radius:20px; border:2px solid green; margin:15px 0;">
            <h3>📝 تعديل تطبيق</h3>
            <input type="hidden" id="editAppIndex"><input type="hidden" id="editAppType">
            <input type="text" id="editAppName" placeholder="اسم التطبيق">
            <textarea id="editAppDesc" placeholder="الوصف"></textarea>
            <input type="text" id="editAppLink" placeholder="رابط التحميل">
            <input type="text" id="editAppIcon" placeholder="رابط الأيقونة">
            <input type="text" id="editPlayerName" placeholder="اسم المشغل (اختياري)">
            <input type="text" id="editPlayerLink" placeholder="رابط المشغل (اختياري)">
            <button onclick="saveEdit()">حفظ</button><button onclick="cancelEdit()" class="close-btn">إلغاء</button>
        </div>

        <h3>➕ إضافة تطبيق</h3>
        <input type="text" id="newAppName" placeholder="اسم التطبيق">
        <textarea id="newAppDesc" placeholder="الوصف"></textarea>
        <input type="text" id="newAppLink" placeholder="رابط التحميل">
        <input type="text" id="newAppIcon" placeholder="رابط الأيقونة">
        <input type="text" id="newPlayerName" placeholder="اسم المشغل (اختياري)">
        <input type="text" id="newPlayerLink" placeholder="رابط المشغل (اختياري)">
        <button onclick="addNewApp()">إضافة التطبيق</button>

        <div id="appListSection">
            <h3>📋 التطبيقات الحالية</h3>
            <div id="appListContainer"></div>
        </div>

        <button class="close-btn" onclick="closeAdminPanel()">إغلاق اللوحة</button>
    </div>
</div>

<div id="mainContent">
    <header>
        <div class="logo-container"><img id="storeLogo" src="" alt="Logo"></div>
        <h1 id="storeName"></h1>
        <div class="sub-brand">VIP EXCLUSIVE</div>
    </header>

    <div class="info-pill">
        <div id="liveClock">00:00:00 PM</div>
        <div id="liveDate">التاريخ</div>
        <div class="dhikr">⚽ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ⚽</div>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab(event, 'apps-tab')">💎 الكل</button>
        <button class="tab-btn" onclick="switchTab(event, 'store-tab')">🏆 المتجر</button>
    </div>

    <div id="apps-tab" class="tab-content"><div class="grid" id="appsGrid"></div></div>
    <div id="store-tab" class="tab-content" style="display: none;"><div class="grid" id="storeGrid"></div></div>

    <footer>
        <p id="footer1"></p>
        <p id="footer2"></p>
    </footer>
</div>
