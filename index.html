<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMosul Store • VIP</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --primary: #00529f; --secondary: #febd11; --bg: #f5f7fa; --card: #ffffff; --text: #0a1a2b;
            --radius: 12px; --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        /* الثيمات بشكل مدمج */
        [data-theme="madrid"] { --primary: #00529f; --secondary: #febd11; --bg: #f5f7fa; }
        [data-theme="black-gold"] { --primary: #ffd700; --secondary: #1a1a1a; --bg: #0a0a0a; --card: #2a2a2a; --text: #ffffff; }
        [data-theme="red"] { --primary: #c62828; --secondary: #ef9a9a; --bg: #ffebee; }
        [data-theme="midnight-blue"] { --primary: #0a192f; --secondary: #64ffda; --bg: #020c1b; --card: #112240; --text: #ccd6f6; }
        [data-theme="green"] { --primary: #2e7d32; --secondary: #a5d6a7; --bg: #e8f5e9; }

        body {
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
        }

        /* الهيدر */
        header { text-align: center; padding: 25px 10px; border-bottom: 3px solid var(--secondary); background: var(--card); }
        #storeLogo { width: 70px; cursor: pointer; transition: 0.3s; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1)); }
        #storeLogo:hover { transform: scale(1.1); }
        #storeName { font-size: 2.2rem; margin: 10px 0 5px; font-weight: 900; color: var(--primary); }
        .sub-brand { font-size: 12px; letter-spacing: 5px; opacity: 0.8; font-weight: bold; }

        /* شريط المعلومات */
        .info-pill { 
            display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap;
            background: var(--card); margin: 15px auto; padding: 12px; width: 90%; 
            border-radius: 50px; border: 1px solid var(--secondary); box-shadow: var(--shadow);
        }
        #liveClock { font-weight: 900; color: var(--primary); font-family: monospace; }

        /* التبويبات */
        .tabs-container { display: flex; justify-content: center; gap: 10px; margin: 20px; }
        .tab-btn { 
            padding: 10px 25px; border: 2px solid var(--secondary); background: var(--card);
            color: var(--primary); border-radius: 30px; cursor: pointer; font-weight: bold; transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: #fff; }

        /* الجريد (الشبكة) */
        .grid { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; 
            max-width: 1200px; margin: 0 auto; 
        }
        .card { 
            background: var(--card); border: 1px solid var(--secondary); border-radius: var(--radius);
            width: 280px; padding: 20px; text-align: center; position: relative;
            box-shadow: var(--shadow); transition: 0.3s; cursor: pointer;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .app-icon { width: 80px; height: 80px; margin: 0 auto 15px; }
        .app-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 15px; }
        .title { font-size: 1.3rem; font-weight: bold; color: var(--primary); margin-bottom: 8px; }
        .desc { font-size: 0.9rem; opacity: 0.8; margin-bottom: 15px; min-height: 40px; }

        .luxury-btn { 
            width: 100%; padding: 10px; background: var(--primary); color: #fff; border: none;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .card:hover .luxury-btn { background: var(--secondary); color: #000; }

        /* الأوفرلاي الخاص بالعد التنازلي */
        .timer-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); color: #fff; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            border-radius: var(--radius); z-index: 10; padding: 15px;
        }

        /* المودالات */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; 
        }
        .admin-panel { 
            background: var(--card); padding: 25px; border-radius: 20px; width: 95%; max-width: 600px;
            max-height: 90vh; overflow-y: auto; color: var(--text);
        }
        .admin-panel input, .admin-panel textarea, .admin-panel select { 
            width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ccc;
        }
        .admin-panel button { padding: 10px 20px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        .save-btn { background: #28a745; color: #fff; }
        .close-btn { background: #dc3545; color: #fff; }

        /* وضع الصيانة */
        .maintenance-mode { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center; font-size:2rem; }

        footer { text-align: center; padding: 30px; margin-top: 40px; border-top: 1px solid var(--secondary); opacity: 0.8; }

        @media (max-width: 600px) { .card { width: 100%; } .info-pill { border-radius: 15px; } }
    </style>
</head>
<body data-theme="madrid">

<div id="maintenanceOverlay" class="maintenance-mode">⚠️ المتجر في صيانة مؤقتة</div>

<div id="mainContent">
    <header>
        <img id="storeLogo" src="https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png" onclick="openLoginModal()" alt="Logo">
        <h1 id="storeName">HDMosul Store</h1>
        <div class="sub-brand">VIP EXCLUSIVE</div>
    </header>

    <div class="info-pill">
        <div id="liveClock">00:00:00</div>
        <div id="liveDate">--/--/----</div>
        <div class="dhikr">⚽ أذكر الله يذكرك ⚽</div>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab(event, 'apps-tab')">💎 التطبيقات</button>
        <button class="tab-btn" onclick="switchTab(event, 'store-tab')">🏆 المتجر</button>
    </div>

    <div id="apps-tab" class="tab-content"><div class="grid" id="appsGrid"></div></div>
    <div id="store-tab" class="tab-content" style="display: none;"><div class="grid" id="storeGrid"></div></div>

    <footer>
        <p id="footerLine1">HDMosul • 2026</p>
        <p id="footerLine2">جميع الحقوق محفوظة</p>
    </footer>
</div>

<div id="loginModal" class="modal-overlay">
    <div class="admin-panel" style="max-width:350px; text-align:center;">
        <h3>دخول الإدارة</h3>
        <input type="password" id="passInput" placeholder="كلمة المرور">
        <button class="save-btn" onclick="checkAuth()">دخول</button>
        <button class="close-btn" onclick="closeModals()">إلغاء</button>
    </div>
</div>

<div id="adminPanel" class="modal-overlay">
    <div class="admin-panel">
        <h2 id="panelTitle">لوحة التحكم</h2>
        
        <div id="ownerOnly" style="display:none; border-bottom: 2px solid var(--secondary); padding-bottom:15px; margin-bottom:15px;">
            <h4>⚙️ إعدادات المتجر (للمالك)</h4>
            <input type="text" id="setStoreName" placeholder="اسم المتجر">
            <select id="setTheme">
                <option value="madrid">مدريدي</option>
                <option value="black-gold">أسود وذهبي</option>
                <option value="red">أحمر ملكي</option>
                <option value="midnight-blue">أزرق ليلي</option>
                <option value="green">أخضر</option>
            </select>
            <label><input type="checkbox" id="setMaint"> وضع الصيانة</label>
            <button class="save-btn" onclick="saveSettings()">حفظ الإعدادات</button>
            <button style="background:#e67e22; color:#fff;" onclick="exportHTML()">تصدير الكود الكامل</button>
        </div>

        <h4>➕ إضافة / تعديل تطبيق</h4>
        <input type="hidden" id="editIdx">
        <input type="text" id="appName" placeholder="اسم التطبيق">
        <input type="text" id="appLink" placeholder="رابط التحميل">
        <input type="text" id="appIcon" placeholder="رابط الأيقونة">
        <textarea id="appDesc" placeholder="الوصف"></textarea>
        <button class="save-btn" onclick="saveApp()">حفظ</button>
        <button onclick="resetAppForm()">تفريغ</button>

        <hr>
        <h4>📋 القائمة الحالية</h4>
        <div id="adminAppList"></div>
        
        <button class="close-btn" style="width:100%; margin-top:20px;" onclick="closeModals()">إغلاق اللوحة</button>
    </div>
</div>

<script>
/* ================== البيانات الأساسية ================== */
// [DATA_START]
const CONFIG = {
    pass: "2001820",
    settings: { name: "HDMosul Store", theme: "madrid", maint: false, footer: "HDMosul • 2026" },
    apps: [
        { name: "Hydra 4K", link: "https://www.mediafire.com/file/6in2lqix8yhyznr/Hydra+4K+@NIGANPRO.apk/file", icon: "https://cdn-icons-png.flaticon.com/512/6294/6294945.png", desc: "كود تفعيل سنة" },
        { name: "أوسكار تيفي Oscar TV", link: "https://aftv.news/5473489", icon: "https://cdn-icons-png.flaticon.com/512/2910/2910724.png", desc: "سينمانا جميع شبكات" }
    ],
    store: [
        { name: "الدعم الفني", link: "mailto:pqkbgfcn688@gmail.com", icon: "https://cdn-icons-png.flaticon.com/512/1827/1827300.png", desc: "للإبلاغ عن الأعطال" }
    ]
};
// [DATA_END]

let currentApps = [...CONFIG.apps];
let currentSettings = {...CONFIG.settings};

/* ================== المحرك الرئيسي ================== */

function init() {
    // تحميل من LocalStorage إذا وجد
    const savedApps = localStorage.getItem('hd_apps');
    const savedSets = localStorage.getItem('hd_sets');
    if(savedApps) currentApps = JSON.parse(savedApps);
    if(savedSets) currentSettings = JSON.parse(savedSets);

    applySettings();
    renderGrid();
    startClock();
}

function applySettings() {
    document.getElementById('storeName').innerText = currentSettings.name;
    document.body.setAttribute('data-theme', currentSettings.theme);
    document.getElementById('maintenanceOverlay').style.display = currentSettings.maint ? 'flex' : 'none';
    document.getElementById('footerLine1').innerText = currentSettings.footer;
}

function renderGrid() {
    const grid = document.getElementById('appsGrid');
    grid.innerHTML = '';
    currentApps.forEach((app, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="timer-overlay" id="timer-${idx}">
                <div style="font-size:1.1rem; margin-bottom:10px;">⚽ لا تلهك المشاهدة عن الصلاة ⚽</div>
                <div id="cnt-${idx}" style="font-size:3rem; font-weight:900; color:var(--secondary);">4</div>
            </div>
            <div class="app-icon"><img src="${app.icon}" onerror="this.src='https://via.placeholder.com/80'"></div>
            <div class="title">${app.name}</div>
            <div class="desc">${app.desc}</div>
            <button class="luxury-btn">تحميل</button>
        `;
        card.onclick = () => startDownload(idx, app.link);
        grid.appendChild(card);
    });

    // رندر المتجر الثابت
    const sGrid = document.getElementById('storeGrid');
    sGrid.innerHTML = '';
    CONFIG.store.forEach(s => {
        const scard = document.createElement('div');
        scard.className = 'card';
        scard.innerHTML = `<div class="app-icon"><img src="${s.icon}"></div><div class="title">${s.name}</div><div class="desc">${s.desc}</div><button class="luxury-btn">انتقال</button>`;
        scard.onclick = () => window.location.href = s.link;
        sGrid.appendChild(scard);
    });
}

function startDownload(idx, link) {
    const overlay = document.getElementById(`timer-${idx}`);
    const cntText = document.getElementById(`cnt-${idx}`);
    overlay.style.display = 'flex';
    let count = 4;
    const timer = setInterval(() => {
        count--;
        cntText.innerText = count;
        if(count <= 0) {
            clearInterval(timer);
            overlay.style.display = 'none';
            window.location.href = link;
        }
    }, 1000);
}

/* ================== الإدارة ================== */

function checkAuth() {
    const p = document.getElementById('passInput').value;
    if(p === CONFIG.pass) {
        document.getElementById('ownerOnly').style.display = 'block';
        openAdmin();
    } else {
        alert('كلمة مرور خاطئة');
    }
}

function openAdmin() {
    closeModals();
    document.getElementById('adminPanel').style.display = 'flex';
    // ملء الإعدادات
    document.getElementById('setStoreName').value = currentSettings.name;
    document.getElementById('setTheme').value = currentSettings.theme;
    document.getElementById('setMaint').checked = currentSettings.maint;
    refreshAdminList();
}

function refreshAdminList() {
    const list = document.getElementById('adminAppList');
    list.innerHTML = '';
    currentApps.forEach((app, i) => {
        const item = document.createElement('div');
        item.style = "display:flex; justify-content:space-between; background:#eee; padding:8px; margin-bottom:5px; border-radius:5px; color:#333;";
        item.innerHTML = `<span>${app.name}</span> <div>
            <button onclick="editApp(${i})" style="background:blue; color:#fff; padding:2px 8px;">تعديل</button>
            <button onclick="deleteApp(${i})" style="background:red; color:#fff; padding:2px 8px;">حذف</button>
        </div>`;
        list.appendChild(item);
    });
}

function saveApp() {
    const name = document.getElementById('appName').value;
    const link = document.getElementById('appLink').value;
    const icon = document.getElementById('appIcon').value;
    const desc = document.getElementById('appDesc').value;
    const idx = document.getElementById('editIdx').value;

    if(!name || !link) return alert('أكمل البيانات');

    const appData = { name, link, icon: icon || 'https://via.placeholder.com/80', desc };

    if(idx !== "") {
        currentApps[idx] = appData;
    } else {
        currentApps.push(appData);
    }

    localStorage.setItem('hd_apps', JSON.stringify(currentApps));
    renderGrid();
    refreshAdminList();
    resetAppForm();
    alert('تم الحفظ بنجاح');
}

function editApp(i) {
    const app = currentApps[i];
    document.getElementById('appName').value = app.name;
    document.getElementById('appLink').value = app.link;
    document.getElementById('appIcon').value = app.icon;
    document.getElementById('appDesc').value = app.desc;
    document.getElementById('editIdx').value = i;
}

function deleteApp(i) {
    if(confirm('هل أنت متأكد؟')) {
        currentApps.splice(i, 1);
        localStorage.setItem('hd_apps', JSON.stringify(currentApps));
        refreshAdminList();
        renderGrid();
    }
}

function saveSettings() {
    currentSettings.name = document.getElementById('setStoreName').value;
    currentSettings.theme = document.getElementById('setTheme').value;
    currentSettings.maint = document.getElementById('setMaint').checked;
    localStorage.setItem('hd_sets', JSON.stringify(currentSettings));
    applySettings();
    alert('تم حفظ الإعدادات');
}

/* ================== وظائف مساعدة ================== */

function switchTab(e, id) {
    document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    e.target.classList.add('active');
}

function startClock() {
    setInterval(() => {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-GB');
        document.getElementById('liveDate').innerText = now.toLocaleDateString('ar-EG');
    }, 1000);
}

function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display='none'); }
function resetAppForm() {
    document.getElementById('editIdx').value = "";
    ['appName', 'appLink', 'appIcon', 'appDesc'].forEach(id => document.getElementById(id).value = "");
}

/* تصدير الكود: يقوم بتحديث مصفوفة CONFIG في النص المصدري */
function exportHTML() {
    let html = document.documentElement.outerHTML;
    const newConfig = { ...CONFIG, apps: currentApps, settings: currentSettings };
    const configStr = `const CONFIG = ${JSON.stringify(newConfig, null, 4)};`;
    
    // استبدال الجزء المحصور بين علامات البيانات
    const regex = /\/\/ \[DATA_START\][\s\S]*?\/\/ \[DATA_END\]/;
    const replacement = `// [DATA_START]\n${configStr}\n// [DATA_END]`;
    
    html = html.replace(regex, replacement);

    const blob = new Blob([html], {type: "text/html"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "index.html";
    a.click();
}

window.onload = init;
</script>
</body>
</html>
