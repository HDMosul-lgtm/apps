<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMosul Store • VIP</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #00529f;
            --secondary-color: #febd11;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #0a1a2b;
            --border-color: #febd11;
            --btn-radius: 50px;
            --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            --title-font-family: 'Cairo', sans-serif;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            background-image: radial-gradient(circle at 20% 30%, rgba(254, 189, 17, 0.08) 0%, transparent 30%), radial-gradient(circle at 80% 70%, rgba(0, 82, 159, 0.08) 0%, transparent 30%);
            color: var(--text-color); min-height: 100vh; overflow-x: hidden; position: relative;
        }

        #storeLogo { width: 60px; filter: drop-shadow(0 5px 15px rgba(254, 189, 17, 0.3)); transition: transform 0.3s; cursor: pointer; }
        #storeLogo:hover { transform: scale(1.1); }

        .maintenance-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gradient-start); z-index: 9998; display: none; align-items: center; justify-content: center; font-size: 12vw; color: var(--primary-color); text-shadow: 0 0 30px var(--secondary-color); }
        .main-content { transition: opacity 0.2s; }
        .main-content.hidden { display: none; }

        /* أنماط المودالات ولوحة التحكم */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .login-box, .admin-panel { background: var(--card-bg); border-radius: 30px; padding: 30px; width: 90%; max-width: 400px; border: 3px solid var(--secondary-color); box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align: center; }
        .admin-panel { max-width: 700px; max-height: 85vh; overflow-y: auto; }
        .login-box h2, .admin-panel h2 { color: var(--primary-color); margin-bottom: 20px; }
        .login-box input, .admin-panel input, .admin-panel textarea, .admin-panel select { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 50px; font-size: 1rem; margin-bottom: 15px; font-family: 'Cairo'; background: var(--card-bg); color: var(--text-color); }
        .admin-panel textarea { border-radius: 20px; resize: vertical; }
        .login-box button, .admin-panel button { background: var(--primary-color); color: white; border: none; padding: 12px 25px; border-radius: var(--btn-radius); font-weight: bold; cursor: pointer; border: 1px solid var(--secondary-color); font-family: 'Cairo'; margin: 5px; transition: 0.3s; box-shadow: var(--btn-shadow); }
        .login-box button:hover, .admin-panel button:hover { background: var(--secondary-color); color: black; }
        .close-btn { background: #ccc !important; color: #333 !important; }

        header { text-align: center; padding: 20px 0 10px; border-bottom: 2px solid var(--secondary-color); }
        #storeName { font-size: 2.8rem; font-weight: 900; background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-color) 50%, var(--secondary-color) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; text-transform: uppercase; }
        .sub-brand { font-size: 14px; letter-spacing: 8px; color: var(--primary-color); font-weight: 800; opacity: 0.9; margin-top: -5px; }

        .info-pill { background: rgba(255, 255, 255, 0.85); border: 1.5px solid var(--secondary-color); border-radius: 100px; padding: 10px 20px; margin: 15px auto; display: flex; gap: 15px; width: 95%; max-width: 900px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); align-items: center; justify-content: space-evenly; flex-wrap: wrap; }
        #liveClock { color: var(--primary-color); font-weight: 900; font-size: 1.2rem; }

        /* واجهة فحص السيرفر المدمجة */
        .tools-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 900px; margin: 10px auto; padding: 0 10px; }
        
        .tool-box {
            background: var(--card-bg);
            border: 2px solid var(--secondary-color);
            border-radius: 40px;
            display: flex;
            align-items: center;
            height: 48px;
            box-shadow: var(--btn-shadow);
            overflow: hidden;
            flex: 1;
            min-width: 280px;
        }
        .tool-box i { padding: 0 15px; color: var(--primary-color); }
        .tool-box input { flex: 1; border: none; outline: none; background: transparent; font-family: 'Cairo'; font-size: 0.9rem; }
        .tool-box button { 
            background: var(--primary-color); color: white; border: none; height: 100%; padding: 0 20px; 
            font-family: 'Cairo'; font-weight: 700; cursor: pointer; transition: 0.3s;
        }
        .tool-box button:hover { background: var(--secondary-color); color: black; }

        /* صندوق نتيجة الفحص */
        #balanceResult {
            width: 90%; max-width: 450px; margin: 10px auto; padding: 10px; border-radius: 15px;
            text-align: center; font-weight: bold; display: none; font-size: 0.9rem;
            border: 2px dashed var(--secondary-color);
        }

        .tabs-container { display: flex; justify-content: center; gap: 20px; margin: 20px auto; }
        .tab-btn { flex: 1; max-width: 200px; background: var(--card-bg); border: 2px solid var(--secondary-color); color: var(--primary-color); padding: 12px; border-radius: var(--btn-radius); cursor: pointer; font-weight: 800; transition: 0.3s; }
        .tab-btn.active { background: var(--primary-color); color: white; }

        .grid { display: grid; gap: 25px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); padding: 20px; max-width: 1400px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 2px solid var(--secondary-color); border-radius: 24px; padding: 25px 20px; text-align: center; position: relative; transition: 0.4s; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.1); cursor: pointer; }
        .app-icon { width: 100px; height: 100px; margin: 0 auto 15px; background: rgba(0,0,0,0.02); border-radius: 20px; padding: 12px; border: 2px solid var(--secondary-color); }
        .app-icon img { max-width: 100%; border-radius: 12px; }
        .title { font-size: 1.5rem; font-weight: 900; color: var(--primary-color); }
        .luxury-btn { background: var(--primary-color); color: white; padding: 12px; border-radius: var(--btn-radius); font-weight: 800; margin-top: 15px; border: 1px solid var(--secondary-color); }
        
        footer { text-align: center; padding: 20px; margin-top: 30px; border-top: 2px solid var(--secondary-color); color: var(--primary-color); }
    </style>
</head>
<body>

<div id="maintenanceOverlay" class="maintenance-overlay">⚠️</div>
<div id="mainContent" class="main-content">
    <header>
        <div class="logo-container">
            <img id="storeLogo" src="https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png" onclick="openLoginModal()">
        </div>
        <h1 id="storeName">HDMosul Store</h1>
        <div class="sub-brand">VIP EXCLUSIVE</div>
    </header>

    <div class="info-pill">
        <div id="liveClock">00:00:00 PM</div>
        <div id="liveDate">التاريخ</div>
        <div class="dhikr">⚽ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ⚽</div>
    </div>

    <div class="tools-container">
        <div class="tool-box">
            <i class="fas fa-download"></i>
            <input type="text" id="downloaderCodeInput" placeholder="كود Downloader">
            <button onclick="openDownloaderCode()">فتح الكود</button>
        </div>

        <div class="tool-box">
            <i class="fas fa-server"></i>
            <input type="text" id="serverSnInput" placeholder="رقم SN الرسيفر">
            <button onclick="checkServerBalance()" id="checkBtnText">زر الرصيد</button>
        </div>
    </div>

    <div id="balanceResult"></div>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab(event, 'apps-tab')">💎 الكل</button>
        <button class="tab-btn" onclick="switchTab(event, 'store-tab')">🏆 المتجر</button>
    </div>

    <div id="apps-tab" class="tab-content"><div class="grid" id="appsGrid"></div></div>
    <div id="store-tab" class="tab-content" style="display: none;"><div class="grid" id="storeGrid"></div></div>

    <footer>
        <p id="footerLine1">HDMosul • PREMIUM STORE • 2026</p>
        <p id="footerLine2">جميع الحقوق محفوظة</p>
    </footer>
</div>

<div id="loginModal" class="modal-overlay"><div class="login-box"><h2>لوحة التحكم</h2><input type="password" id="passwordInput" placeholder="رمز الدخول"><button onclick="checkPassword()">دخول</button><button class="close-btn" onclick="closeLoginModal()">إلغاء</button></div></div>
<div id="adminPanelModal" class="modal-overlay">
    <div class="admin-panel">
        <h2 id="panelTitle">لوحة التحكم</h2>
        <div id="storeSettingsSection">
            <div class="settings-form-container">
                <input type="text" id="settingsStoreName" placeholder="اسم المتجر">
                <input type="text" id="settingsLogoUrl" placeholder="رابط الشعار">
                <button onclick="saveStoreSettings()">حفظ</button>
            </div>
        </div>
        <div id="appListSection"><div id="appListContainer"></div></div>
        <button class="close-btn" onclick="closeAdminPanel()">إغلاق</button>
    </div>
</div>

<script>
(function(){
    var OWNER_PASSWORD = "2001820";
    var storeSettings = { name: 'HDMosul Store', logoUrl: 'https://upload.wikimedia.org/wikipedia/en/thumb/5/56/Real_Madrid_CF.svg/1200px-Real_Madrid_CF.svg.png', maintenanceMode: false, brandName: 'HDMosul', footer1: 'HDMosul • PREMIUM STORE • 2026', footer2: 'جميع الحقوق محفوظة' };
    
    // بيانات التطبيقات (نفس بياناتك)
    var DEFAULT_APPS = [
        { name: "Hydra 4K", desc: "كود تفعيل سنة (كيبل ضوئي) • HDMosul", link: "https://www.mediafire.com/file/6in2lqix8yhyznr/Hydra+4K+@NIGANPRO.apk/file", icon: "https://i.ibb.co/wvjxZSY/01-JT3-DM40-HTDS0-SWRF2-ZAX967-P.jpg", isPremiere: true },
        { name: "MovieBox VIP", desc: "سينمانا جميع شبكات • بدون إعلانات • HDMosul", link: "https://www.mediafire.com/file/x0r8u9cu37gzu5a/MovieBox+-+Family+(VIP).apk/file", icon: "https://i.ibb.co/ycCG2Fmt/android-icon-192x192.png" }
    ];

    // وظيفة فحص السيرفر
    async function checkServerBalance() {
        const sn = document.getElementById('serverSnInput').value;
        const resultDiv = document.getElementById('balanceResult');
        const btn = document.getElementById('checkBtnText');

        if (!sn) { alert("يرجى إدخال رقم الـ SN"); return; }

        btn.innerText = "جاري الفحص...";
        resultDiv.style.display = "block";
        resultDiv.style.color = "var(--primary-color)";
        resultDiv.innerHTML = "جاري الاتصال بالسيرفر...";

        try {
            // استدعاء السيرفر (يمكنك تغيير الرابط للرابط المباشر لاحقاً)
            const response = await fetch(`http://hdbox.vip/api/check.php?sn=${sn}`);
            const data = await response.json();

            if (data.status === "active") {
                resultDiv.style.color = "green";
                resultDiv.innerHTML = "✅ الاشتراك فعال حتى: " + (data.expire_date || "2027/01/01");
            } else {
                resultDiv.style.color = "red";
                resultDiv.innerHTML = "❌ الاشتراك منتهي أو الرقم خاطئ";
            }
        } catch (error) {
            resultDiv.style.color = "orange";
            resultDiv.innerHTML = "⚠️ تعذر الاتصال التلقائي بالسيرفر حالياً";
        } finally {
            btn.innerText = "زر الرصيد";
        }
    }

    // وظيفة Downloader
    function openDownloaderCode() {
        var code = document.getElementById('downloaderCodeInput').value.trim();
        if(code) window.location.href = "https://aftv.news/" + code.replace(/[^0-9]/g, '');
        else alert("أدخل الكود أولاً");
    }

    // إدارة المحتوى (التابات، الوقت، إلخ)
    function updateClock() {
        var now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-US');
        document.getElementById('liveDate').innerText = now.toLocaleDateString('ar-EG');
    }

    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).style.display = 'block';
        evt.currentTarget.classList.add('active');
    }

    // دوال المودال والتحكم (نفس منطق كودك)
    window.openLoginModal = function(){ document.getElementById('loginModal').style.display = 'flex'; };
    window.closeLoginModal = function(){ document.getElementById('loginModal').style.display = 'none'; };
    window.checkPassword = function(){ if(document.getElementById('passwordInput').value === OWNER_PASSWORD){ closeLoginModal(); document.getElementById('adminPanelModal').style.display = 'flex'; } else alert('خطأ'); };
    window.closeAdminPanel = function(){ document.getElementById('adminPanelModal').style.display = 'none'; };
    window.checkServerBalance = checkServerBalance;
    window.openDownloaderCode = openDownloaderCode;
    window.switchTab = switchTab;

    // تشغيل التطبيقات عند التحميل
    window.onload = function() {
        updateClock();
        setInterval(updateClock, 1000);
        
        // رندر افتراضي للتطبيقات (تبسيطاً للمثال)
        var grid = document.getElementById('appsGrid');
        DEFAULT_APPS.forEach(app => {
            var card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="app-icon"><img src="${app.icon}"></div><div class="title">${app.name}</div><div class="desc">${app.desc}</div><button class="luxury-btn" onclick="window.location.href='${app.link}'">تحميل</button>`;
            grid.appendChild(card);
        });
    };
})();
</script>
</body>
</html>
