    <style>
        /* ==================== */
        /* Dynamic Theme System */
        /* ==================== */
        :root {
            /* Madrid (Default) */
            --primary-color: #00529f;
            --secondary-color: #febd11;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #0a1a2b;
            --border-color: rgba(254, 189, 17, 0.3);
            --btn-radius: 50px;
            --btn-shadow: 0 5px 15px rgba(0, 82, 159, 0.3);
            --glass-white: rgba(255, 255, 255, 0.85);
            --gold-gradient: linear-gradient(135deg, #febd11 0%, #ffd700 50%, #febd11 100%);
            --blue-gradient: linear-gradient(135deg, #00529f 0%, #0077cc 100%);
        }

        body.theme-blue {
            --primary-color: #1e3a8a; --secondary-color: #3b82f6; --bg-gradient-start: #eff6ff; --bg-gradient-end: #dbeafe;
            --card-bg: #ffffff; --text-color: #1e3a8a; --border-color: #3b82f6; --btn-radius: 12px;
        }
        body.theme-black-gold {
            --primary-color: #febd11; --secondary-color: #febd11; --bg-gradient-start: #000000; --bg-gradient-end: #1a1a1a;
            --card-bg: #111111; --text-color: #ffffff; --border-color: #febd11; --btn-radius: 0px;
        }
        body.theme-green {
            --primary-color: #064e3b; --secondary-color: #10b981; --bg-gradient-start: #ecfdf5; --bg-gradient-end: #d1fae5;
            --card-bg: #ffffff; --text-color: #064e3b; --border-color: #10b981; --btn-radius: 50px;
        }
        body.theme-red {
            --primary-color: #991b1b; --secondary-color: #ef4444; --bg-gradient-start: #fef2f2; --bg-gradient-end: #fee2e2;
            --card-bg: #ffffff; --text-color: #7f1d1d; --border-color: #ef4444; --btn-radius: 20px;
        }
        body.theme-purple {
            --primary-color: #581c87; --secondary-color: #a855f7; --bg-gradient-start: #faf5ff; --bg-gradient-end: #f3e8ff;
            --card-bg: #ffffff; --text-color: #581c87; --border-color: #a855f7; --btn-radius: 40px;
        }
        body.theme-orange {
            --primary-color: #7c2d12; --secondary-color: #f97316; --bg-gradient-start: #fff7ed; --bg-gradient-end: #ffedd5;
            --card-bg: #ffffff; --text-color: #7c2d12; --border-color: #f97316; --btn-radius: 15px;
        }
        body.theme-cyan {
            --primary-color: #164e63; --secondary-color: #06b6d4; --bg-gradient-start: #ecfeff; --bg-gradient-end: #cffafe;
            --card-bg: #ffffff; --text-color: #164e63; --border-color: #06b6d4; --btn-radius: 30px;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-color); min-height: 100vh; overflow-x: hidden; position: relative;
        }

        #maintenanceOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient-start); z-index: 9998;
            display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center;
        }
        #maintenanceOverlay i { font-size: 80px; color: var(--secondary-color); margin-bottom: 20px; }

        .admin-gear {
            position: fixed; top: 20px; left: 20px; z-index: 9999; cursor: pointer;
            background: var(--primary-color); color: var(--secondary-color);
            width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 24px; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            border: 2px solid var(--secondary-color); transition: 0.3s;
        }
        .admin-gear:hover { transform: rotate(90deg); background: var(--secondary-color); color: var(--primary-color); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 10000; display: none; align-items: center; justify-content: center;
        }

        .login-box, .admin-panel {
            background: white; border-radius: 30px; padding: 30px; width: 95%; max-width: 650px;
            border: 3px solid var(--secondary-color); box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            text-align: center; max-height: 90vh; overflow-y: auto; color: #333;
        }

        .login-box input, .admin-panel input, .admin-panel textarea, .admin-panel select {
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px;
            font-size: 1rem; margin-bottom: 15px; font-family: 'Cairo';
        }

        .admin-panel button, .login-box button {
            background: var(--primary-color); color: white; border: none; padding: 10px 20px;
            border-radius: var(--btn-radius); font-weight: bold; cursor: pointer; transition: 0.3s; margin: 5px;
        }

        header { text-align: center; padding: 30px 0; border-bottom: 2px solid var(--secondary-color); }
        .logo { width: 70px; margin-bottom: 10px; }
        .brand { font-size: 2.5rem; font-weight: 900; color: var(--primary-color); text-transform: uppercase; margin: 0; }
        
        .info-pill {
            background: var(--glass-white); border: 1.5px solid var(--secondary-color);
            border-radius: 100px; padding: 15px; margin: 20px auto; display: flex;
            justify-content: space-around; width: 95%; max-width: 900px; flex-wrap: wrap;
        }

        .grid {
            display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            padding: 20px; max-width: 1400px; margin: 0 auto;
        }

        .card {
            background: var(--card-bg); border: 2px solid var(--secondary-color);
            border-radius: 24px; padding: 20px; text-align: center; position: relative;
            transition: 0.3s; display: flex; flex-direction: column; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
        .app-icon { width: 80px; height: 80px; margin: 0 auto 15px; z-index: 2; position: relative; }
        .app-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 15px; }

        .luxury-btn {
            background: var(--primary-color); color: white; border-radius: var(--btn-radius);
            padding: 12px; border: 1px solid var(--secondary-color); font-weight: 800; cursor: pointer;
            margin-top: 10px; width: 100%; box-shadow: var(--btn-shadow); z-index: 2; position: relative;
        }
        .player-btn { background: var(--secondary-color); color: #000; }

        .timer-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary-color); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: white;
        }

        .tabs-container { display: flex; justify-content: center; gap: 10px; margin: 20px; }
        .tab-btn { padding: 10px 30px; border-radius: 50px; border: 2px solid var(--secondary-color); cursor: pointer; font-weight: bold; background: white; color: var(--text-color); }
        .tab-btn.active { background: var(--primary-color); color: white; }

        footer { text-align: center; padding: 30px; border-top: 2px solid var(--secondary-color); margin-top: 40px; }
    </style>
</head>

        function loadData() {
            let a = localStorage.getItem("hdmosul_apps_v2");
            let b = localStorage.getItem("hdmosul_store_v2");
            let c = localStorage.getItem("hdmosul_settings");

            if (a) { appsList = JSON.parse(a); } else { appsList = [...defaultApps]; }
            if (b) { storeList = JSON.parse(b); } else { storeList = [...defaultStore]; }
            if (c) { settings = { ...settings, ...JSON.parse(c) }; }
            
            applySettings();
        }

        function applySettings() {
            document.body.className = settings.theme;
            document.getElementById("displayBrandName").innerText = settings.brandName;
            document.getElementById("fLine1").innerText = settings.footerLine1;
            document.getElementById("fLine2").innerText = settings.footerLine2;
            document.getElementById("maintenanceOverlay").style.display = settings.maintenance ? "flex" : "none";
        }

        function renderGrid(gridId, data, isStore) {
            const g = document.getElementById(gridId);
            g.innerHTML = "";
            data.forEach((a, i) => {
                const c = document.createElement("div");
                c.className = "card";
                const desc = a.desc.replaceAll("HDMosul", settings.brandName);
                
                let btns = `<button class="luxury-btn" onclick="openLink(this, '${a.link1}')">HDIM</button>`;
                
                if (a.playerName && a.playerLink) {
                    btns += `<button class="luxury-btn player-btn" onclick="window.location.href='${a.playerLink}'">${a.playerName}</button>`;
                }
                
                c.innerHTML = `
                    <div class="timer-overlay">
                        <div style="font-weight:bold; margin-bottom:10px;">⚽ ألا بذكر الله تطمئن القلوب ⚽</div>
                        <div class="count-down" style="font-size:30px; font-weight:900;">4</div>
                    </div>
                    <div class="app-icon"><img src="${a.icon}"></div>
                    <h3 style="position:relative; z-index:2;">${a.name}</h3>
                    <p style="position:relative; z-index:2;">${desc}</p>
                    ${btns}
                `;
                g.appendChild(c);
            });
        }

        function openLink(e, u) {
            const o = e.closest(".card").querySelector(".timer-overlay");
            let c = 4;
            o.style.display = "flex";
            const i = setInterval(() => {
                c--;
                o.querySelector(".count-down").innerText = c;
                if (c < 0) {
                    clearInterval(i);
                    window.location.href = u;
                }
            }, 1000);
        }

        window.onload = () => {
            loadData();
            renderGrid("appsGrid", appsList, false);
            renderGrid("storeGrid", storeList, true);
            setInterval(updateClock, 1000);
            updateClock();
        };

        function updateClock() {
            const n = new Date();
            document.getElementById("liveClock").innerText = n.toLocaleTimeString('ar-EG');
            document.getElementById("liveDate").innerText = n.toLocaleDateString('ar-EG');
        }

        function openLoginModal() { document.getElementById("loginModal").style.display = "flex"; }
        
        function checkPassword() {
            let p = document.getElementById("passwordInput").value;
            if (p === OWNER_PASSWORD) { currentRole = "owner"; showAdmin(); }
            else if (p === MODERATOR_PASSWORD) { currentRole = "moderator"; showAdmin(); }
            else { alert("رمز الدخول غير صحيح!"); }
            document.getElementById("passwordInput").value = "";
        }

        function showAdmin() {
            document.getElementById("loginModal").style.display = "none";
            document.getElementById("adminPanelModal").style.display = "flex";
            if (currentRole === "owner") {
                document.getElementById("settingsSection").style.display = "block";
                document.getElementById("settingTheme").value = settings.theme;
                document.getElementById("settingBrand").value = settings.brandName;
                document.getElementById("settingFooter1").value = settings.footerLine1;
                document.getElementById("settingFooter2").value = settings.footerLine2;
                document.getElementById("settingMaintenance").checked = settings.maintenance;
            } else {
                document.getElementById("settingsSection").style.display = "none";
            }
            document.getElementById("editFormContainer").style.display = "block";
            refreshManageList();
        }

        function saveStoreSettings() {
            settings.brandName = document.getElementById("settingBrand").value || settings.brandName;
            settings.theme = document.getElementById("settingTheme").value;
            settings.footerLine1 = document.getElementById("settingFooter1").value || settings.footerLine1;
            settings.footerLine2 = document.getElementById("settingFooter2").value || settings.footerLine2;
            settings.maintenance = document.getElementById("settingMaintenance").checked;
            
            localStorage.setItem("hdmosul_settings", JSON.stringify(settings));
            applySettings();
            renderGrid("appsGrid", appsList, false);
            renderGrid("storeGrid", storeList, true);
            alert("تم حفظ الإعدادات بنجاح.");

        function saveApp() {
            const a = {
                name: document.getElementById("appName").value,
                desc: document.getElementById("appDesc").value,
                link1: document.getElementById("appLink").value,
                icon: document.getElementById("appIcon").value,
                playerName: document.getElementById("playerName").value,
                playerLink: document.getElementById("playerLink").value
            };
            
            if(!a.name || !a.link1) { alert("الرجاء إدخال اسم التطبيق ورابط التحميل على الأقل"); return; }
            
            appsList.push(a);
            localStorage.setItem("hdmosul_apps_v2", JSON.stringify(appsList));
            renderGrid("appsGrid", appsList, false);
            refreshManageList();
            cancelEdit();
        }

        function refreshManageList() {
            const c = document.getElementById("appListContainer");
            c.innerHTML = "";
            appsList.forEach((a, i) => {
                c.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee; background:#fff; border-radius:8px; margin-bottom:5px;">
                    <span style="font-weight:bold;">${a.name}</span>
                    <button onclick="deleteApp(${i})" style="background:#dc3545; padding:5px 15px;">حذف</button>
                </div>`;
            });
        }

        function deleteApp(i) {
            if(confirm("هل أنت متأكد من حذف هذا التطبيق؟")) {
                appsList.splice(i, 1);
                localStorage.setItem("hdmosul_apps_v2", JSON.stringify(appsList));
                renderGrid("appsGrid", appsList, false);
                refreshManageList();
            }
        }

        function switchTab(t, e) {
            document.querySelectorAll(".tab-content").forEach(c => c.style.display = "none");
            document.getElementById(t).style.display = "block";
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
            e.classList.add("active");
        }

        function closeAdminPanel() { document.getElementById("adminPanelModal").style.display = "none"; }
        function closeLoginModal() { document.getElementById("loginModal").style.display = "none"; }
        function previewTheme(v) { document.body.className = v; }
        
        function cancelEdit() { 
            document.getElementById("appName").value = '';
            document.getElementById("appDesc").value = '';
            document.getElementById("appLink").value = '';
            document.getElementById("appIcon").value = '';
            document.getElementById("playerName").value = '';
            document.getElementById("playerLink").value = '';
        }
    </script>
</body>
</html>
