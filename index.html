<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDMosul Quran • مكتبة القرآن الكريم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== المتغيرات الافتراضية (نفس ستايلك بالضبط) ========== */
        :root {
            --primary-color: #00529f;
            --secondary-color: #febd11;
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #ffffff;
            --card-bg: #ffffff;
            --text-color: #0a1a2b;
            --border-color: #febd11;
            --btn-radius: 50px;
            --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            --title-font-family: 'Cairo', sans-serif;
        }

        [data-theme="dark"] {
            --primary-color: #1e90ff;
            --secondary-color: #ffd700;
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --card-bg: #0f3460;
            --text-color: #e0e0e0;
            --border-color: #ffd700;
            --btn-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-color); min-height: 100vh; overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* التحكم بالثيم */
        .theme-switcher {
            position: fixed; bottom: 20px; left: 20px; z-index: 9999;
            display: flex; gap: 8px; background: var(--card-bg); padding: 8px 12px;
            border-radius: 50px; border: 1px solid var(--secondary-color);
            box-shadow: var(--btn-shadow);
        }
        .theme-btn {
            width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--text-color);
            cursor: pointer; transition: transform 0.2s;
        }
        .theme-btn[data-theme-name="light"] { background: linear-gradient(145deg, #00529f, #febd11); }
        .theme-btn[data-theme-name="dark"] { background: linear-gradient(145deg, #1e90ff, #0f3460); }

        /* الهيدر */
        header { text-align: center; padding: 30px 0 10px; border-bottom: 2px solid var(--secondary-color); }
        #storeLogo { width: 80px; filter: drop-shadow(0 5px 15px rgba(254, 189, 17, 0.3)); cursor: pointer; transition: 0.3s; }
        #storeLogo:hover { transform: scale(1.1); }
        #storeName { font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 10px 0 0; }
        .sub-brand { font-size: 14px; letter-spacing: 5px; color: var(--primary-color); font-weight: 800; }

        /* المعلومات */
        .info-pill { background: rgba(255, 255, 255, 0.85); border: 1.5px solid var(--secondary-color); border-radius: 100px; padding: 10px 20px; margin: 15px auto; display: flex; gap: 15px; width: 90%; max-width: 800px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); align-items: center; justify-content: space-evenly; flex-wrap: wrap; }
        #liveClock { color: var(--primary-color); font-weight: 900; font-size: 1.1rem; }
        #liveDate { color: var(--text-color); font-weight: 700; background: rgba(254, 189, 17, 0.15); padding: 5px 15px; border-radius: 50px; }

        /* البحث */
        .search-container { max-width: 450px; margin: 10px auto; padding: 0 20px; }
        .search-box { display: flex; align-items: center; background: var(--card-bg); border: 2px solid var(--secondary-color); border-radius: 40px; height: 48px; overflow: hidden; }
        .search-box input { flex: 1; border: none; outline: none; padding: 0 15px; font-family: 'Cairo'; background: transparent; color: var(--text-color); }
        .search-box button { background: var(--primary-color); color: white; border: none; padding: 0 20px; height: 100%; cursor: pointer; font-weight: 700; }

        /* التبويبات */
        .tabs-container { display: flex; justify-content: center; gap: 15px; margin: 20px; }
        .tab-btn { padding: 10px 25px; border-radius: 50px; border: 2px solid var(--secondary-color); background: var(--card-bg); color: var(--primary-color); font-weight: 800; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: var(--primary-color); color: white; }

        /* الشبكة والكروت */
        .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card-bg); border: 2px solid var(--secondary-color); border-radius: 24px; padding: 20px; text-align: center; position: relative; transition: 0.4s; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .app-icon { width: 90px; height: 90px; margin: 0 auto 15px; border-radius: 50%; border: 3px solid var(--secondary-color); overflow: hidden; background: #f0f0f0; }
        .app-icon img { width: 100%; height: 100%; object-fit: cover; }
        .title { font-size: 1.3rem; font-weight: 900; color: var(--primary-color); margin-bottom: 5px; }
        .desc { font-size: 0.9rem; opacity: 0.8; min-height: 40px; }
        .luxury-btn { background: var(--primary-color); color: white; border: none; padding: 12px; border-radius: 50px; font-weight: 800; margin-top: 10px; cursor: pointer; border: 1px solid var(--secondary-color); }

        /* العداد التنازلي */
        .timer-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary-color); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; border-radius: 22px; }
        .count-down { font-size: 3.5rem; font-weight: 900; color: var(--secondary-color); }

        /* المودال ولوحة التحكم (نفس ميكانيكية الكود السابق) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .login-box, .admin-panel { background: var(--card-bg); border-radius: 30px; padding: 30px; width: 90%; max-width: 500px; border: 3px solid var(--secondary-color); text-align: center; max-height: 90vh; overflow-y: auto; }
        .admin-panel input, .admin-panel textarea { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 20px; border: 1px solid #ccc; font-family: 'Cairo'; }
        
        footer { text-align: center; padding: 30px; border-top: 2px solid var(--secondary-color); margin-top: 50px; opacity: 0.8; }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img id="storeLogo" src="https://cdn-icons-png.flaticon.com/512/2874/2874811.png" alt="لوحة التحكم" onclick="openLoginModal()">
    </div>
    <h1 id="storeName">مكتبة القرآن الكريم</h1>
    <div class="sub-brand">HDMOSUL QURAN</div>
</header>

<div class="info-pill">
    <div id="liveClock">00:00:00</div>
    <div id="liveDate">اليوم والتاريخ</div>
    <div style="color:var(--primary-color); font-weight:800;">📖 ورتّل القرآن ترتيلاً</div>
</div>

<div class="search-container">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن قارئ أو سورة...">
        <button onclick="searchQurra()"><i class="fas fa-search"></i></button>
    </div>
</div>

<div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab(event, 'all')">✨ جميع القراء</button>
    <button class="tab-btn" onclick="switchTab(event, 'live')">📻 إذاعات بث مباشر</button>
</div>

<div class="grid" id="qurraGrid">
    </div>

<footer>
    <p>© 2026 HDMosul Quran • جميع الحقوق محفوظة</p>
</footer>

<div class="theme-switcher">
    <div class="theme-btn" data-theme-name="light" onclick="setTheme('light')"></div>
    <div class="theme-btn" data-theme-name="dark" onclick="setTheme('dark')"></div>
</div>

<div id="loginModal" class="modal-overlay">
    <div class="login-box">
        <h2><i class="fas fa-lock"></i> إدارة المكتبة</h2>
        <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور">
        <button class="luxury-btn" style="width:100%" onclick="checkPassword()">دخول</button>
        <button onclick="closeLoginModal()" style="background:none; border:none; cursor:pointer; margin-top:10px; color:var(--text-color)">إغلاق</button>
    </div>
</div>

<div id="adminPanelModal" class="modal-overlay">
    <div class="admin-panel">
        <h2>لوحة التحكم</h2>
        <div id="qurraListManager"></div>
        <hr>
        <h3>إضافة قارئ جديد</h3>
        <input type="text" id="newName" placeholder="اسم القارئ">
        <input type="text" id="newDesc" placeholder="الوصف (مثلاً: المصحف المجود)">
        <input type="text" id="newLink" placeholder="رابط الاستماع/الموقع">
        <input type="text" id="newIcon" placeholder="رابط صورة القارئ">
        <button class="luxury-btn" onclick="addQari()">إضافة للمكتبة</button>
        <button class="luxury-btn" style="background:#e67e22" onclick="exportHTML()">نسخ كود الصفحة المحدث</button>
        <button onclick="closeAdminPanel()" style="display:block; margin:20px auto; color:red; border:none; background:none; cursor:pointer;">إغلاق</button>
    </div>
</div>

<script>
    // كلمة المرور الافتراضية
    const PASS = "2001820";

    // قائمة القراء (تستطيع التعديل عليها أو الإضافة من لوحة التحكم)
    let qurraData = [
        { name: "عبد الباسط عبد الصمد", desc: "المصحف المجود والترتيل", link: "https://server7.mp3quran.net/basit/", icon: "https://i.pinimg.com/originals/f3/f1/3d/f3f13d80362f6b86488d3d957d19a3b6.jpg" },
        { name: "محمد صديق المنشاوي", desc: "الخاشع الباكي - المصحف المعلم", link: "https://server10.mp3quran.net/minsh/", icon: "https://i.ibb.co/3yxYp9v/minshawi.jpg" },
        { name: "مشاري راشد العفاسي", desc: "صوت عذب من دولة الكويت", link: "https://server8.mp3quran.net/afs/", icon: "https://i.ibb.co/68Xk5F7/afasy.jpg" },
        { name: "سعود الشريم", desc: "إمام الحرم المكي الشريف سابقاً", link: "https://server7.mp3quran.net/shur/", icon: "https://i.ibb.co/FmP0zHh/shuraim.jpg" },
        { name: "ماهر المعيقلي", desc: "إمام وخطيب المسجد الحرام", link: "https://server12.mp3quran.net/maher/", icon: "https://i.ibb.co/7XW2m3V/maher.jpg" },
        { name: "ياسر الدوسري", desc: "نبرة حجازية مميزة - إمام الحرم", link: "https://server11.mp3quran.net/yasser/", icon: "https://i.ibb.co/fHnLd8L/yasser.jpg" },
        { name: "ناصر القطامي", desc: "تلاوات خاشعة ومنوعة", link: "https://server6.mp3quran.net/qtm/", icon: "https://i.ibb.co/mHk9R4k/qatami.jpg" },
        { name: "إسلام صبحي", desc: "تلاوات هادئة للقلوب", link: "https://server14.mp3quran.net/islam/", icon: "https://i.ibb.co/9vjY4K3/islam.jpg" }
    ];

    function init() {
        renderQurra(qurraData);
        updateClock();
        setInterval(updateClock, 1000);
        setTheme(localStorage.getItem('quran_theme') || 'light');
    }

    function renderQurra(data) {
        const grid = document.getElementById('qurraGrid');
        grid.innerHTML = '';
        data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="timer-overlay" id="timer-${index}">
                    <div style="margin-bottom:10px">جاري فتح المكتبة...</div>
                    <div class="count-down" id="count-${index}">4</div>
                </div>
                <div class="app-icon"><img src="${item.icon}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2874/2874811.png'"></div>
                <div class="title">${item.name}</div>
                <div class="desc">${item.desc}</div>
                <button class="luxury-btn">استماع الآن</button>
            `;
            card.onclick = () => startTimer(index, item.link);
            grid.appendChild(card);
        });
    }

    function startTimer(index, link) {
        const overlay = document.getElementById(`timer-${index}`);
        const countDisplay = document.getElementById(`count-${index}`);
        overlay.style.display = 'flex';
        let count = 3;
        const interval = setInterval(() => {
            count--;
            countDisplay.innerText = count;
            if (count <= 0) {
                clearInterval(interval);
                window.location.href = link;
                setTimeout(() => overlay.style.display = 'none', 1000);
            }
        }, 1000);
    }

    function searchQurra() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const filtered = qurraData.filter(q => q.name.toLowerCase().includes(term) || q.desc.toLowerCase().includes(term));
        renderQurra(filtered);
    }

    // إدارة الثيم
    function setTheme(t) {
        document.body.setAttribute('data-theme', t);
        localStorage.setItem('quran_theme', t);
    }

    // الساعة والتاريخ
    function updateClock() {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('ar-EG');
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('liveDate').innerText = now.toLocaleDateString('ar-EG', options);
    }

    // لوحة التحكم
    function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
    function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
    
    function checkPassword() {
        if (document.getElementById('passwordInput').value === PASS) {
            closeLoginModal();
            openAdminPanel();
        } else {
            alert("خطأ في كلمة المرور");
        }
    }

    function openAdminPanel() {
        document.getElementById('adminPanelModal').style.display = 'flex';
        const list = document.getElementById('qurraListManager');
        list.innerHTML = '<h3>القراء الحاليون</h3>';
        qurraData.forEach((q, i) => {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; background:#eee; padding:5px; color:#000; border-radius:10px;">
                <span>${q.name}</span>
                <button onclick="deleteQari(${i})" style="color:red; border:none; cursor:pointer;">حذف</button>
            </div>`;
        });
    }

    function closeAdminPanel() { document.getElementById('adminPanelModal').style.display = 'none'; }

    function addQari() {
        const name = document.getElementById('newName').value;
        const desc = document.getElementById('newDesc').value;
        const link = document.getElementById('newLink').value;
        const icon = document.getElementById('newIcon').value;
        if(name && link) {
            qurraData.push({name, desc, link, icon});
            renderQurra(qurraData);
            openAdminPanel();
            alert("تمت الإضافة بنجاح");
        }
    }

    function deleteQari(i) {
        qurraData.splice(i, 1);
        renderQurra(qurraData);
        openAdminPanel();
    }

    function exportHTML() {
        let fullCode = document.documentElement.outerHTML;
        navigator.clipboard.writeText(fullCode).then(() => alert("تم نسخ الكود المحدث! يمكنك الآن وضعه في ملف index.html"));
    }

    function switchTab(e, type) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        if(type === 'live') {
            // إضافة إذاعات بسيطة كمثال
            renderQurra([
                { name: "إذاعة القرآن الكريم - مصر", desc: "بث مباشر من القاهرة", link: "https://www.ertu.org/quran/", icon: "https://yt3.googleusercontent.com/ytc/AIdro_n8h_8n_kH2N8" },
                { name: "إذاعة القرآن الكريم - السعودية", desc: "بث مباشر من الرياض", link: "https://www.al-quran.sa/", icon: "https://yt3.googleusercontent.com/o_YI6rXbA_I6X" }
            ]);
        } else {
            renderQurra(qurraData);
        }
    }

    window.onload = init;
</script>

</body>
</html>
